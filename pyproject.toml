[project]
name = "website-3fmindset"
version = "0.1.0"
description = "3F Mindset content generation pipeline tools"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pytest>=8.0",
  "PyYAML>=6.0",
]

[project.scripts]
burn-pipeline = "burn_pipeline.interface:main"
content-score = "content_scoring.interface:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "automation"}
packages = ["burn_pipeline", "content_scoring"]

[tool.uv]
package = true
