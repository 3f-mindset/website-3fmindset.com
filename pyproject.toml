[project]
name = "website-3fmindset"
version = "0.1.0"
description = "3F Mindset content generation pipeline tools"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "tomli>=2.0.1",
]

[project.scripts]
burn-pipeline = "burn_pipeline.interface:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["burn_pipeline"]

[tool.uv]
package = true
