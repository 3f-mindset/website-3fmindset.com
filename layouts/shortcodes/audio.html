<figure {{ with .Get "class" }}class="{{ . }}" {{ end }}>
    {{ with .Get "src" }}
    <audio controls preload="{{ $.Get " preload" | default "metadata" }}">
        <source src="{{ . | relURL }}" type="audio/mpeg">
    </audio>
    {{ else }}
    <div id="elevenlabs-audionative-widget" data-height="90" data-width="100%" data-frameborder="no" data-scrolling="no"
        data-publicuserid="4378f9d5af82c6e7285ebfbfd3004c4a825ca3db3177267be9d066536568e1e9"
        data-playerurl="https://elevenlabs.io/player/index.html">Loading the <a
            href="https://elevenlabs.io/text-to-speech" target="_blank" rel="noopener">Elevenlabs Text to Speech</a>
        AudioNative Player...</div>
    <script src="https://elevenlabs.io/player/audioNativeHelper.js" type="text/javascript"></script>
    {{ end }}
    {{ with .Get "caption" }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>
