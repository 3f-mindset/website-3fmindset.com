# Pipeline configuration. Add model to any step to override its modality default.
context:
  title: Turn Your Big Goal Into a Plan You Can Start Today
  slug: systems-for-goals-from-vision-to-action-steps
  date: '2026-08-14'
  model: AUDIT
  target_dir: content/letters/2026-08-14-systems-for-goals-from-vision-to-action-steps
providers:
  text:
    kind: openai-compatible
    providerUrl: http://localhost:11435
    model: active
    timeout_seconds: 300
    retry_attempts: 4
    retry_wait_seconds: 75
  image:
    kind: openai-compatible
    providerUrl: http://localhost:11435
    model: unsloth-qwen-image-2512-gguf-qwen-image-2512-q4-k-m
    timeout_seconds: 900
    retry_attempts: 4
    retry_wait_seconds: 75
  audio:
    kind: openai-compatible
    providerUrl: http://localhost:11435
    model: AUDIO_MODEL_NAME
variables:
  voice: direct, pragmatic, masculine, concrete
  audience: men who need structure, ownership, and steady action
tracks:
  promo_assets: false
  landing_page: false
steps:
- id: lesson
  format: markdown
  prompt_file: automation/prompts/burn/lesson.md
  output: content/letters/2026-08-14-systems-for-goals-from-vision-to-action-steps/LESSON.md
  inputs:
  - path: content/letters/2026-08-14-systems-for-goals-from-vision-to-action-steps/CONTEXT.md
    alias: context
  - path: content/letters/2026-08-14-systems-for-goals-from-vision-to-action-steps/SEED.md
    alias: seed
  - path: content/letters/2026-08-14-systems-for-goals-from-vision-to-action-steps/index.md
    alias: draft_index
- id: instructions
  format: markdown
  prompt_file: automation/prompts/burn/instructions.md
  output: content/letters/2026-08-14-systems-for-goals-from-vision-to-action-steps/INSTRUCTIONS.md
  depends_on:
  - lesson
  inputs:
  - step: lesson
    alias: lesson
  - path: content/letters/2026-08-14-systems-for-goals-from-vision-to-action-steps/CONTEXT.md
    alias: context
  - path: content/letters/2026-08-14-systems-for-goals-from-vision-to-action-steps/SEED.md
