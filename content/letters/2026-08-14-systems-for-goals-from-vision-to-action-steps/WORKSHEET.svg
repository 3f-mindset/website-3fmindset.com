<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <rect width="1200" height="900" fill="#f4f0e8"/><rect x="35" y="35" width="1130" height="830" fill="none" stroke="#143b4a" stroke-width="3"/>
