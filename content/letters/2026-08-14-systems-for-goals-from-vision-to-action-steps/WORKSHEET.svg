  <rect x="75" y="265" width="1050" height="150" fill="#fff" stroke="#999"/><text x="90" y="300" font-family="Arial" font-size="14" fill="#999">TASKS / OBLIGATIONS / OPEN LOOPS</text>
  <text x="75" y="465" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#143b4a">O — ORDER</text><text x="75" y="495" font-family="Arial,sans-serif" font-size="16" fill="#555">Choose the three rocks with the highest consequence.</text>
  <rect x="75" y="515" width="330" height="120" fill="#fff" stroke="#999"/><rect x="435" y="515" width="330" height="120" fill="#fff" stroke="#999"/><rect x="795" y="515" width="330" height="120" fill="#fff" stroke="#999"/>
  <text x="90" y="545" font-family="Arial" font-size="16" font-weight="bold" fill="#d27b32">ROCK 1</text><text x="450" y="545" font-family="Arial" font-size="16" font-weight="bold" fill="#d27b32">ROCK 2</text><text x="810" y="545" font-family="Arial" font-size="16" font-weight="bold" fill="#d27b32">ROCK 3</text>
  <text x="75" y="690" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#143b4a">R — RESERVE</text><text x="75" y="720" font-family="Arial,sans-serif" font-size="16" fill="#555">When and where will each rock get your best attention?</text>
