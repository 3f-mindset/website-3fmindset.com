<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img"
    aria-labelledby="title desc">
    <title id="title">SB21 Worksheet, Adapt and Overcome</title>
    <desc id="desc">Landscape worksheet on a white background with large title, introduction,
        fillable sections built around the PIVOTS action model, and a three step summary footer.</desc>

    <defs>
        <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
      .tag { font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: 700; fill: #111111; }
    </style>
    </defs>

    <rect class="bg" x="0" y="0" width="1100" height="850" />

    <rect class="line" x="24" y="24" width="1052" height="802" rx="22" ry="22" />

    <text class="tiny" x="48" y="48">SB21</text>
    <text class="title" x="48" y="82">ADAPT AND OVERCOME</text>
    <text class="sub" x="48" y="106">Flexibility in Adversity</text>

    <text class="verb" x="850" y="76">PIVOTS</text>
    <text class="tiny" x="850" y="98">Pause. Inspect. Visualize. Operate. Track. Sharpen.</text>

    <rect class="mini" x="48" y="128" width="1004" height="76" />
    <text class="label" x="70" y="152">CHOICE</text>
    <text class="small" x="70" y="174">Keep forcing a broken plan and call it discipline, or adapt
        before pressure locks you in place.</text>
    <text class="small" x="70" y="190">The mission stays fixed. The method gets refined. Use this
        page to find one stuck point, pivot fast, and sharpen the result.</text>

    <line class="soft" x1="48" y1="218" x2="1052" y2="218" />
    <line class="soft" x1="48" y1="616" x2="1052" y2="616" />

    <rect class="box" x="48" y="230" width="320" height="170" />
    <circle class="line" cx="82" cy="266" r="24" />
    <text class="letter" x="70" y="278">P</text>
    <text class="label" x="118" y="254">PAUSE THE PATTERN</text>
    <text class="tiny" x="118" y="271">Name the loop that keeps failing.</text>
    <text class="small" x="70" y="302">Where am I stuck?</text>
    <line class="fillline" x1="70" y1="322" x2="342" y2="322" />
    <line class="fillline" x1="70" y1="344" x2="342" y2="344" />
    <text class="small" x="70" y="372">What do I keep repeating?</text>
    <line class="fillline" x1="70" y1="390" x2="342" y2="390" />

    <rect class="box" x="390" y="230" width="320" height="170" />
    <circle class="line" cx="424" cy="266" r="24" />
    <text class="letter" x="416" y="278">I</text>
    <text class="label" x="460" y="254">INSPECT THE FRICTION</text>
    <text class="tiny" x="460" y="271">Study resistance as feedback.</text>
    <text class="small" x="412" y="302">What keeps blocking progress?</text>
    <line class="fillline" x1="412" y1="322" x2="684" y2="322" />
    <line class="fillline" x1="412" y1="344" x2="684" y2="344" />
    <text class="small" x="412" y="372">What can I control or adjust?</text>
    <line class="fillline" x1="412" y1="390" x2="684" y2="390" />

    <rect class="box" x="732" y="230" width="320" height="170" />
    <circle class="line" cx="766" cy="266" r="24" />
    <text class="letter" x="755" y="278">V</text>
    <text class="label" x="802" y="254">VISUALIZE NEW ANGLES</text>
    <text class="tiny" x="802" y="271">Create options before pride chooses.</text>
    <text class="small" x="754" y="302">Plan B:</text>
    <line class="fillline" x1="812" y1="302" x2="1026" y2="302" />
    <text class="small" x="754" y="332">Plan C:</text>
    <line class="fillline" x1="812" y1="332" x2="1026" y2="332" />
    <text class="small" x="754" y="362">Wild angle:</text>
    <line class="fillline" x1="832" y1="362" x2="1026" y2="362" />
    <text class="tiny" x="754" y="389">Do not write “try harder.” Write a new path.</text>

    <rect class="box" x="48" y="432" width="320" height="170" />
    <circle class="line" cx="82" cy="468" r="24" />
    <text class="letter" x="70" y="480">O</text>
    <text class="label" x="118" y="456">OPERATE BEFORE READY</text>
    <text class="tiny" x="118" y="473">Test one pivot now.</text>
    <text class="small" x="70" y="504">The pivot I will test:</text>
    <line class="fillline" x1="70" y1="524" x2="342" y2="524" />
    <line class="fillline" x1="70" y1="546" x2="342" y2="546" />
    <text class="small" x="70" y="574">Start time and first move:</text>
    <line class="fillline" x1="206" y1="574" x2="342" y2="574" />

    <rect class="box" x="390" y="432" width="320" height="170" />
    <circle class="line" cx="424" cy="468" r="24" />
    <text class="letter" x="414" y="480">T</text>
    <text class="label" x="460" y="456">TRACK THE RESPONSE</text>
    <text class="tiny" x="460" y="473">Measure what changes.</text>
    <text class="tag" x="412" y="504">RESULT</text>
    <line class="fillline" x1="472" y1="504" x2="684" y2="504" />
    <text class="tag" x="412" y="532">ENERGY</text>
    <line class="fillline" x1="472" y1="532" x2="684" y2="532" />
    <text class="tag" x="412" y="560">STRESS</text>
    <line class="fillline" x1="472" y1="560" x2="684" y2="560" />
    <text class="tag" x="412" y="588">NEXT SIGNAL</text>
    <line class="fillline" x1="500" y1="588" x2="684" y2="588" />

    <rect class="box" x="732" y="432" width="320" height="170" />
    <circle class="line" cx="766" cy="468" r="24" />
    <text class="letter" x="756" y="480">S</text>
    <text class="label" x="802" y="456">SHARPEN THROUGH REPS</text>
    <text class="tiny" x="802" y="473">Refine until the method serves the mission.</text>
    <text class="small" x="754" y="504">What worked?</text>
    <line class="fillline" x1="854" y1="504" x2="1026" y2="504" />
    <text class="small" x="754" y="534">What failed?</text>
    <line class="fillline" x1="846" y1="534" x2="1026" y2="534" />
    <text class="small" x="754" y="564">What will I keep refining?</text>
    <line class="fillline" x1="912" y1="564" x2="1026" y2="564" />
    <text class="tiny" x="754" y="591">Adaptation becomes identity through repeated correction.</text>

    <rect class="mini" x="48" y="632" width="1004" height="78" />
    <text class="label" x="70" y="656">REFLECTION</text>
    <text class="small" x="70" y="678">Where am I still trying to force a locked door instead of
        finding another entrance?</text>
    <line class="fillline" x1="70" y1="696" x2="1028" y2="696" />

    <rect class="mini" x="48" y="732" width="310" height="58" />
    <text class="num" x="70" y="768">1</text>
    <text class="label" x="106" y="758">BREAK</text>
    <text class="tiny" x="106" y="776">Identify the stuck pattern and stop defending it.</text>

    <rect class="mini" x="394" y="732" width="310" height="58" />
    <text class="num" x="416" y="768">2</text>
    <text class="label" x="452" y="758">PIVOT</text>
    <text class="tiny" x="452" y="776">Choose one new approach and test it this week.</text>

    <rect class="mini" x="740" y="732" width="312" height="58" />
    <text class="num" x="762" y="768">3</text>
    <text class="label" x="798" y="758">REFINE</text>
    <text class="tiny" x="798" y="776">Track the result and sharpen the method again.</text>

    <text class="tiny" x="48" y="812">FINAL STRIKE: The mission matters. The method must earn its
        place.</text>
</svg>