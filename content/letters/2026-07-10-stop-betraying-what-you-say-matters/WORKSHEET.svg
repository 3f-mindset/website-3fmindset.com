<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img"
    aria-labelledby="title desc">
    <title id="title">SB28 Worksheet, Values Alignment Check</title>
    <desc id="desc">Landscape worksheet on a white background with large title, introduction,
        fillable sections built around the ALIGN action model, and a three step summary footer.</desc>

    <defs>
        <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
      .dot { fill: #111111; }
    </style>
    </defs>

    <rect class="bg" x="0" y="0" width="1100" height="850" />

    <text id="mainTitle" class="title" x="40" y="48">SB28 | Values Alignment Check</text>
    <text class="sub" x="40" y="76">Are You Living Your Principles?</text>
    <text class="verb" x="928" y="58">ALIGN</text>

    <rect class="box" x="40" y="98" width="1020" height="78" />
    <text class="label" x="62" y="124">CHOICE</text>
    <text class="small" x="62" y="146">Keep claiming values while your habits tell a different
        story, or choose one value, find one gap,</text>
    <text class="small" x="62" y="163">and take one visible action this week that proves your
        principles are real.</text>

    <rect class="mini" x="40" y="198" width="200" height="220" />
    <text class="letter" x="62" y="236">A</text>
    <text class="label" x="102" y="222">ADMIT THE VALUE</text>
    <text class="tiny" x="102" y="240">Name one value that needs proof.</text>
    <text class="small" x="62" y="272">Value:</text>
    <line class="fillline" x1="62" y1="292" x2="218" y2="292" />
    <text class="small" x="62" y="325">Why it matters:</text>
    <line class="fillline" x1="62" y1="348" x2="218" y2="348" />
    <line class="fillline" x1="62" y1="374" x2="218" y2="374" />
    <line class="fillline" x1="62" y1="400" x2="218" y2="400" />

    <rect class="mini" x="260" y="198" width="260" height="220" />
    <text class="letter" x="282" y="236">L</text>
    <text class="label" x="322" y="222">LIST THE EVIDENCE</text>
    <text class="tiny" x="322" y="240">Separate proof from drift.</text>
    <text class="small" x="282" y="268">Actions that support this value:</text>
    <line class="fillline" x1="282" y1="290" x2="498" y2="290" />
    <line class="fillline" x1="282" y1="315" x2="498" y2="315" />
    <line class="fillline" x1="282" y1="340" x2="498" y2="340" />
    <text class="small" x="282" y="370">Actions that weaken this value:</text>
    <line class="fillline" x1="282" y1="392" x2="498" y2="392" />
    <line class="fillline" x1="282" y1="407" x2="498" y2="407" />

    <rect class="mini" x="540" y="198" width="250" height="220" />
    <text class="letter" x="562" y="236">I</text>
    <text class="label" x="602" y="222">IDENTIFY THE GAP</text>
    <text class="tiny" x="602" y="240">Name where words and actions split.</text>
    <text class="small" x="562" y="270">I say I value:</text>
    <line class="fillline" x1="562" y1="292" x2="768" y2="292" />
    <text class="small" x="562" y="322">But my behavior shows:</text>
    <line class="fillline" x1="562" y1="344" x2="768" y2="344" />
    <line class="fillline" x1="562" y1="370" x2="768" y2="370" />
    <text class="tiny" x="562" y="400">Pick one gap you can act on this week.</text>

    <rect class="mini" x="810" y="198" width="250" height="220" />
    <text class="letter" x="832" y="236">G</text>
    <text class="label" x="872" y="222">GIVE IT ONE RULE</text>
    <text class="tiny" x="872" y="240">Turn the value into a measurable rule.</text>
    <text class="small" x="832" y="270">My rule this week:</text>
    <line class="fillline" x1="832" y1="292" x2="1038" y2="292" />
    <line class="fillline" x1="832" y1="318" x2="1038" y2="318" />
    <text class="small" x="832" y="350">How I will measure it:</text>
    <line class="fillline" x1="832" y1="372" x2="1038" y2="372" />
    <line class="fillline" x1="832" y1="398" x2="1038" y2="398" />

    <rect class="box" x="40" y="448" width="1020" height="180" />
    <text class="letter" x="62" y="493">N</text>
    <text class="label" x="105" y="478">NAIL IT THIS WEEK</text>
    <text class="small" x="105" y="500">Schedule the first action. Do not leave the value floating.
        Put it on the calendar and create proof.</text>

    <rect class="mini" x="62" y="522" width="300" height="80" />
    <text class="label" x="82" y="548">FIRST ACTION</text>
    <text class="tiny" x="82" y="566">What will you do first?</text>
    <line class="fillline" x1="82" y1="588" x2="340" y2="588" />

    <rect class="mini" x="400" y="522" width="300" height="80" />
    <text class="label" x="420" y="548">TIME AND PLACE</text>
    <text class="tiny" x="420" y="566">When and where will it happen?</text>
    <line class="fillline" x1="420" y1="588" x2="678" y2="588" />

    <rect class="mini" x="738" y="522" width="300" height="80" />
    <text class="label" x="758" y="548">PROOF TO RECORD</text>
    <text class="tiny" x="758" y="566">What will show that you lived it?</text>
    <line class="fillline" x1="758" y1="588" x2="1016" y2="588" />

    <rect class="box" x="40" y="652" width="1020" height="95" />
    <text class="label" x="62" y="680">WEEK END CHECK</text>
    <text class="small" x="62" y="706">What changed when you acted in alignment?</text>
    <line class="fillline" x1="310" y1="706" x2="1038" y2="706" />
    <text class="small" x="62" y="732">What resistance showed up?</text>
    <line class="fillline" x1="240" y1="732" x2="1038" y2="732" />

    <rect class="mini" x="40" y="770" width="320" height="48" />
    <text class="num" x="58" y="802">1</text>
    <text class="label" x="88" y="792">NAME THE STANDARD</text>
    <text class="tiny" x="88" y="808">Pick one value that needs inspection.</text>

    <rect class="mini" x="390" y="770" width="320" height="48" />
    <text class="num" x="408" y="802">2</text>
    <text class="label" x="438" y="792">EXPOSE THE DRIFT</text>
    <text class="tiny" x="438" y="808">Compare what supports and weakens it.</text>

    <rect class="mini" x="740" y="770" width="320" height="48" />
    <text class="num" x="758" y="802">3</text>
    <text class="label" x="788" y="792">PROVE THE PRINCIPLE</text>
    <text class="tiny" x="788" y="808">Follow one rule that makes the value visible.</text>

    <circle class="dot" cx="250" cy="308" r="3" />
    <circle class="dot" cx="530" cy="308" r="3" />
    <circle class="dot" cx="800" cy="308" r="3" />
    <line class="soft" x1="240" y1="308" x2="260" y2="308" />
    <line class="soft" x1="520" y1="308" x2="540" y2="308" />
    <line class="soft" x1="790" y1="308" x2="810" y2="308" />
</svg>