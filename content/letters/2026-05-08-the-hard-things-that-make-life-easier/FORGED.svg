<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img"
    aria-labelledby="title desc">
    <title id="title">SB19 Worksheet, Step into the Heat</title>
    <desc id="desc">Landscape worksheet on a white background with large title, choice statement,
        fillable sections built around the FORGED action model, and a three step summary footer.</desc>

    <defs>
        <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
      .dot { fill: #111111; }
    </style>
    </defs>

    <rect class="bg" x="0" y="0" width="1100" height="850" />

    <text class="tiny" x="36" y="28">SB19</text>
    <text class="title" x="36" y="64">STEP INTO THE HEAT: EMBRACE DISCOMFORT</text>
    <text class="sub" x="36" y="92">FORGED worksheet</text>

    <rect class="box" x="36" y="112" width="1028" height="82" />
    <text class="label" x="56" y="139">CHOICE</text>
    <text class="small" x="56" y="160">You can keep avoiding every hard moment and stay fragile when
        pressure arrives, or you can choose one safe discomfort</text>
    <text class="small" x="56" y="177">and train yourself to stay steady inside it. This week is not
        punishment. It is proof built through action.</text>

    <rect class="box" x="36" y="216" width="318" height="212" />
    <text class="letter" x="56" y="255">F</text>
    <text class="label" x="96" y="244">FACE</text>
    <text class="small" x="96" y="262">Name the safe discomfort you will face.</text>
    <line class="fillline" x1="56" y1="292" x2="330" y2="292" />
    <line class="fillline" x1="56" y1="324" x2="330" y2="324" />
    <text class="label" x="56" y="360">Why does this challenge make me uneasy?</text>
    <line class="fillline" x1="56" y1="390" x2="330" y2="390" />

    <rect class="box" x="391" y="216" width="318" height="212" />
    <text class="letter" x="411" y="255">O</text>
    <text class="label" x="455" y="244">OBEY</text>
    <text class="small" x="455" y="262">Set the rule before your mood argues.</text>
    <text class="label" x="411" y="292">My rule:</text>
    <line class="fillline" x1="411" y1="322" x2="685" y2="322" />
    <line class="fillline" x1="411" y1="354" x2="685" y2="354" />
    <text class="small" x="411" y="389">When resistance shows up, I will act first.</text>

    <rect class="box" x="746" y="216" width="318" height="212" />
    <text class="letter" x="766" y="255">R</text>
    <text class="label" x="807" y="244">REPEAT</text>
    <text class="small" x="807" y="262">Track seven days without breaking the chain.</text>
    <text class="tiny" x="770" y="300">DAY 1</text>
    <circle class="soft" cx="810" cy="297" r="12" />
    <text class="tiny" x="850" y="300">DAY 2</text>
    <circle class="soft" cx="890" cy="297" r="12" />
    <text class="tiny" x="930" y="300">DAY 3</text>
    <circle class="soft" cx="970" cy="297" r="12" />
    <text class="tiny" x="770" y="346">DAY 4</text>
    <circle class="soft" cx="810" cy="343" r="12" />
    <text class="tiny" x="850" y="346">DAY 5</text>
    <circle class="soft" cx="890" cy="343" r="12" />
    <text class="tiny" x="930" y="346">DAY 6</text>
    <circle class="soft" cx="970" cy="343" r="12" />
    <text class="tiny" x="770" y="392">DAY 7</text>
    <circle class="soft" cx="810" cy="389" r="12" />
    <text class="small" x="850" y="393">Streak proves identity.</text>

    <rect class="box" x="36" y="452" width="318" height="212" />
    <text class="letter" x="56" y="491">G</text>
    <text class="label" x="99" y="480">GRIND</text>
    <text class="small" x="99" y="498">Stay with the first wave of resistance.</text>
    <text class="label" x="56" y="532">What will make me want to quit?</text>
    <line class="fillline" x1="56" y1="562" x2="330" y2="562" />
    <line class="fillline" x1="56" y1="594" x2="330" y2="594" />
    <text class="label" x="56" y="630">My response:</text>
    <line class="fillline" x1="140" y1="630" x2="330" y2="630" />

    <rect class="box" x="391" y="452" width="318" height="212" />
    <text class="letter" x="411" y="491">E</text>
    <text class="label" x="452" y="480">EXAMINE</text>
    <text class="small" x="452" y="498">Catch the excuse. Name the proof.</text>
    <text class="label" x="411" y="532">The excuse I expect:</text>
    <line class="fillline" x1="411" y1="562" x2="685" y2="562" />
    <text class="label" x="411" y="596">The proof I want after:</text>
    <line class="fillline" x1="411" y1="626" x2="685" y2="626" />

    <rect class="box" x="746" y="452" width="318" height="212" />
    <text class="letter" x="766" y="491">D</text>
    <text class="label" x="807" y="480">DOMINATE</text>
    <text class="small" x="807" y="498">Finish the week with evidence.</text>
    <text class="label" x="766" y="532">After seven days, I proved:</text>
    <line class="fillline" x1="766" y1="562" x2="1040" y2="562" />
    <line class="fillline" x1="766" y1="594" x2="1040" y2="594" />
    <text class="label" x="766" y="630">Next hard thing I will face:</text>
    <line class="fillline" x1="938" y1="630" x2="1040" y2="630" />

    <rect class="mini" x="36" y="690" width="1028" height="92" />
    <text class="label" x="56" y="718">ACTION STEPS SUMMARY</text>
    <text class="small" x="56" y="742">1. Choose the Fire: Pick one safe discomfort that pushes your
        comfort zone and creates controlled pressure.</text>
    <text class="small" x="56" y="760">2. Stay in the Heat: Complete it daily for seven days without
        negotiation so discipline becomes practiced.</text>
    <text class="small" x="56" y="778">3. Become Unshaken: Track the change in your mind so
        discomfort loses control over your choices.</text>

    <rect class="mini" x="36" y="800" width="1028" height="28" />
    <text class="tiny" x="56" y="818">Final check: Did I choose a challenge that is safe, specific,
        repeatable, and uncomfortable enough to train me?</text>
</svg>