<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">SBXX Worksheet, The Simple Check-In That Keeps You From Quitting</title>
  <desc id="desc">Landscape worksheet on a white background with large title, introduction, fillable sections built around the FUEL action model, and a three step summary footer.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
      .dot { fill: #111111; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="850"/>

  <text class="tiny" x="40" y="34">SBXX</text>
  <text class="title" x="40" y="70">THE SIMPLE CHECK-IN THAT KEEPS YOU FROM QUITTING</text>
  <text class="sub" x="40" y="96">Open the Port: Turn Vague Goals into Hard Facts</text>

  <rect class="mini" x="700" y="34" width="360" height="78"/>
  <text class="label" x="720" y="58">THE PROBLEM</text>
  <text class="small" x="720" y="78">You are not lazy or broken. You are simply alone.</text>
  <text class="small" x="720" y="94">Without outside pressure, you will quietly lower the bar.</text>

  <text class="verb" x="444" y="142">FUEL</text>
  <line class="line" x1="40" y1="154" x2="1060" y2="154"/>

  <rect class="box" x="40" y="180" width="320" height="185"/>
  <text class="letter" x="60" y="222">F</text>
  <text class="label" x="105" y="204">FIND THE ONE GOAL</text>
  <text class="small" x="105" y="224">Identify the single point of friction.</text>
  <text class="tiny" x="105" y="242">Specific, measurable, and slipping right now.</text>
  <line class="fillline" x1="60" y1="270" x2="330" y2="270"/>
  <line class="fillline" x1="60" y1="300" x2="330" y2="300"/>
  <line class="fillline" x1="60" y1="330" x2="330" y2="330"/>

  <rect class="box" x="390" y="180" width="320" height="185"/>
  <text class="letter" x="410" y="222">U</text>
  <text class="label" x="455" y="204">USE A SIMPLE METHOD</text>
  <text class="small" x="455" y="224">Choose the most reliable vehicle for pressure.</text>
  <text class="tiny" x="455" y="242">Partner, group, app, or public commitment.</text>
  <line class="fillline" x1="410" y1="270" x2="680" y2="270"/>
  <line class="fillline" x1="410" y1="300" x2="680" y2="300"/>
  <line class="fillline" x1="410" y1="330" x2="680" y2="330"/>

  <rect class="box" x="740" y="180" width="320" height="185"/>
  <text class="letter" x="760" y="222">E</text>
  <text class="label" x="805" y="204">ENTER A CLEAR AGREEMENT</text>
  <text class="small" x="805" y="224">Define exactly what you will report and when.</text>
  <text class="tiny" x="805" y="242">Include the consequence for missing the check-in.</text>
  <line class="fillline" x1="760" y1="270" x2="1030" y2="270"/>
  <line class="fillline" x1="760" y1="300" x2="1030" y2="300"/>
  <line class="fillline" x1="760" y1="330" x2="1030" y2="330"/>

  <rect class="box" x="40" y="395" width="320" height="185"/>
  <text class="letter" x="60" y="437">L</text>
  <text class="label" x="105" y="419">LOG AND LIVE THE FIRST CHECK-IN</text>
  <text class="small" x="105" y="439">Execute the first report on time and honestly.</text>
  <text class="tiny" x="105" y="457">Facts are enough. No excuses. Schedule the next one.</text>
  <line class="fillline" x1="60" y1="485" x2="330" y2="485"/>
  <line class="fillline" x1="60" y1="515" x2="330" y2="515"/>
  <line class="fillline" x1="60" y1="545" x2="330" y2="545"/>

  <rect class="box" x="390" y="395" width="320" height="185"/>
  <text class="label" x="410" y="419">THE EXACT MESSAGE</text>
  <text class="small" x="410" y="439">Write the text or email to initiate the agreement.</text>
  <text class="tiny" x="410" y="457">"I am working on [Goal]. Can I check in with you...?"</text>
  <line class="fillline" x1="410" y1="485" x2="680" y2="485"/>
  <line class="fillline" x1="410" y1="515" x2="680" y2="515"/>
  <line class="fillline" x1="410" y1="545" x2="680" y2="545"/>

  <rect class="box" x="740" y="395" width="320" height="185"/>
  <text class="label" x="760" y="419">WHY IT MATTERS</text>
  <text class="small" x="760" y="439">Articulate why this specific goal matters now.</text>
  <text class="tiny" x="760" y="457">If you cannot say why, the pressure feels like a burden.</text>
  <line class="fillline" x1="760" y1="485" x2="1030" y2="485"/>
  <line class="fillline" x1="760" y1="515" x2="1030" y2="515"/>
  <line class="fillline" x1="760" y1="545" x2="1030" y2="545"/>

  <rect class="mini" x="40" y="610" width="1020" height="88"/>
  <text class="label" x="60" y="636">FINAL COMMAND</text>
  <text class="small" x="60" y="660">The pressure is not your enemy. It is your fuel. Stop guessing. Start reporting.</text>
  <line class="fillline" x1="60" y1="684" x2="1030" y2="684"/>

  <rect class="mini" x="40" y="725" width="315" height="82"/>
  <text class="num" x="60" y="760">1</text>
  <text class="label" x="95" y="748">PICK ONE</text>
  <text class="tiny" x="95" y="768">Select the single goal that is slipping.</text>
  <text class="tiny" x="95" y="784">Make it small, clear, and measurable.</text>

  <rect class="mini" x="392" y="725" width="315" height="82"/>
  <text class="num" x="412" y="760">2</text>
  <text class="label" x="447" y="748">SET THE RHYTHM</text>
  <text class="tiny" x="447" y="768">Choose the method and the specific time.</text>
  <text class="tiny" x="447" y="784">Keep it low-friction and consistent.</text>

  <rect class="mini" x="745" y="725" width="315" height="82"/>
  <text class="num" x="765" y="760">3</text>
  <text class="label" x="800" y="748">SEND THE MESSAGE</text>
  <text class="tiny" x="800" y="768">Initiate the agreement today.</text>