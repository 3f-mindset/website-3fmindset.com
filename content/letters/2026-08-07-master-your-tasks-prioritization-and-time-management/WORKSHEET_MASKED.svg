<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">SB32 Worksheet, Master Your Tasks</title>
  <desc id="desc">Landscape worksheet on a white background with large title, introduction, fillable sections built around the CHART action model, and a three step summary footer.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
      .dot { fill: #111111; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="850"/>

  <text class="tiny" x="40" y="34">SB32</text>
  <text class="title" x="40" y="70">MASTER YOUR TASKS</text>
  <text class="sub" x="40" y="96">PRIORITIZATION AND TIME MANAGEMENT</text>

  <rect class="mini" x="700" y="34" width="360" height="78"/>
  <text class="label" x="720" y="58">CHOICE</text>
  <rect x="720" y="70" width="340" height="14" fill="#d4d4d4"/>
  <rect x="720" y="86" width="350" height="14" fill="#cccccc"/>

  <text class="verb" x="444" y="142">CHART</text>
  <line class="line" x1="40" y1="154" x2="1060" y2="154"/>

  <rect class="box" x="40" y="180" width="320" height="185"/>
  <text class="letter" x="60" y="222">C</text>
  <text class="label" x="105" y="204">CAPTURE EVERY DEMAND</text>
  <rect x="105" y="216" width="220" height="14" fill="#d8d8d8"/>
  <rect x="105" y="234" width="230" height="12" fill="#c5c5c5"/>
  <line x1="60" y1="270" x2="330" y2="270" stroke="#d0d0d0" stroke-width="1"/>
  <line x1="60" y1="300" x2="330" y2="300" stroke="#d4d4d4" stroke-width="1"/>
  <line x1="60" y1="330" x2="330" y2="330" stroke="#cccccc" stroke-width="1"/>

  <rect class="box" x="380" y="180" width="320" height="185"/>
  <text class="letter" x="400" y="222">H</text>
  <text class="label" x="445" y="204">SORT BY IMPACT</text>
  <rect x="445" y="216" width="210" height="14" fill="#d4d4d4"/>
  <rect x="445" y="234" width="240" height="12" fill="#cccccc"/>
  <rect x="400" y="260" width="15" height="12" fill="#d8d8d8"/>
  <line x1="420" y1="268" x2="670" y2="268" stroke="#c5c5c5" stroke-width="1"/>
  <rect x="400" y="284" width="15" height="12" fill="#d0d0d0"/>
  <line x1="420" y1="292" x2="670" y2="292" stroke="#d4d4d4" stroke-width="1"/>
  <rect x="400" y="308" width="15" height="12" fill="#cccccc"/>
  <line x1="420" y1="316" x2="670" y2="316" stroke="#d8d8d8" stroke-width="1"/>

  <rect class="box" x="720" y="180" width="320" height="185"/>
  <text class="letter" x="740" y="222">A</text>
  <text class="label" x="785" y="204">BLOCK PEAK HOURS</text>
  <rect x="785" y="216" width="220" height="14" fill="#d4d4d4"/>
  <rect x="785" y="234" width="230" height="12" fill="#cccccc"/>
  <rect x="740" y="260" width="45" height="12" fill="#d8d8d8"/>
  <line x1="800" y1="268" x2="1010" y2="268" stroke="#c5c5c5" stroke-width="1"/>
  <rect x="740" y="284" width="45" height="12" fill="#d0d0d0"/>
  <line x1="800" y1="292" x2="1010" y2="292" stroke="#d4d4d4" stroke-width="1"/>
  <rect x="740" y="308" width="45" height="12" fill="#cccccc"/>
  <line x1="800" y1="316" x2="1010" y2="316" stroke="#d8d8d8" stroke-width="1"/>

  <rect class="box" x="40" y="380" width="500" height="185"/>
  <text class="letter" x="60" y="422">R</text>
  <text class="label" x="105" y="404">PROTECT FOCUS</text>
  <rect x="105" y="416" width="240" height="14" fill="#d4d4d4"/>
  <rect x="105" y="434" width="250" height="12" fill="#cccccc"/>
  <line x1="60" y1="470" x2="510" y2="470" stroke="#d0d0d0" stroke-width="1"/>
  <line x1="60" y1="500" x2="510" y2="500" stroke="#d4d4d4" stroke-width="1"/>
  <line x1="60" y1="530" x2="510" y2="530" stroke="#cccccc" stroke-width="1"/>

  <rect class="box" x="560" y="380" width="500" height="185"/>
  <text class="letter" x="580" y="422">T</text>
  <text class="label" x="625" y="404">REVIEW AND RESET</text>
  <rect x="625" y="416" width="230" height="14" fill="#d8d8d8"/>
  <rect x="625" y="434" width="240" height="12" fill="#c5c5c5"/>
  <rect x="580" y="462" width="35" height="12" fill="#d4d4d4"/>
  <line x1="630" y1="470" x2="1030" y2="470" stroke="#cccccc" stroke-width="1"/>
  <rect x="580" y="492" width="35" height="12" fill="#d0d0d0"/>
  <line x1="630" y1="500" x2="1030" y2="500" stroke="#d8d8d8" stroke-width="1"/>
  <rect x="580" y="522" width="25" height="12" fill="#cccccc"/>
  <line x1="630" y1="530" x2="1030" y2="530" stroke="#d4d4d4" stroke-width="1"/>

  <rect class="mini" x="40" y="600" width="1020" height="88"/>
  <text class="label" x="60" y="626">FINAL COMMAND</text>
  <rect x="60" y="642" width="970" height="14" fill="#d4d4d4"/>
  <line x1="60" y1="674" x2="1030" y2="674" stroke="#cccccc" stroke-width="1"/>

  <rect class="mini" x="40" y="725" width="315" height="82"/>
  <text class="num" x="60" y="760">1</text>
  <text class="label" x="95" y="748">DUMP AND SORT</text>
  <rect x="95" y="760" width="280" height="12" fill="#d8d8d8"/>
  <rect x="95" y="776" width="180" height="12" fill="#c5c5c5"/>

  <rect class="mini" x="392" y="725" width="315" height="82"/>
  <text class="num" x="412" y="760">2</text>
  <text class="label" x="447" y="748">BLOCK AND SHIELD</text>
  <rect x="447" y="760" width="220" height="12" fill="#d4d4d4"/>
  <rect x="447" y="776" width="240" height="12" fill="#cccccc"/>

  <rect class="mini" x="745" y="725" width="315" height="82"/>
  <text class="num" x="765" y="760">3</text>
  <text class="label" x="800" y="748">REVIEW AND RESET</text>
  <rect x="800" y="760" width="230" height="12" fill="#d0d0d0"/>
  <rect x="800" y="776" width="210" height="12" fill="#d8d8d8"/>
</svg>
