<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">SB32 Worksheet, Master Your Tasks</title>
  <desc id="desc">Landscape worksheet on a white background with large title, introduction, fillable sections built around the CHART action model, and a three step summary footer.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
      .dot { fill: #111111; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="850"/>

  <text class="tiny" x="40" y="34">SB32</text>
  <text class="title" x="40" y="70">MASTER YOUR TASKS</text>
  <text class="sub" x="40" y="96">PRIORITIZATION AND TIME MANAGEMENT</text>

  <rect class="mini" x="700" y="34" width="360" height="78"/>
  <text class="label" x="720" y="58">CHOICE</text>
  <text class="small" x="720" y="78">Keep letting the loudest request dictate your day, or pick</text>
  <text class="small" x="720" y="94">a simple system that forces you to choose what matters first.</text>

  <text class="verb" x="444" y="142">CHART</text>
  <line class="line" x1="40" y1="154" x2="1060" y2="154"/>

  <rect class="box" x="40" y="180" width="320" height="185"/>
  <text class="letter" x="60" y="222">C</text>
  <text class="label" x="105" y="204">CAPTURE EVERY DEMAND</text>
  <text class="small" x="105" y="224">Dump all tasks, meetings, and ideas into one list.</text>
  <text class="tiny" x="105" y="242">Avoid vague entries. Use specific, actionable items.</text>
  <line class="fillline" x1="60" y1="270" x2="330" y2="270"/>
  <line class="fillline" x1="60" y1="300" x2="330" y2="300"/>
  <line class="fillline" x1="60" y1="330" x2="330" y2="330"/>

  <rect class="box" x="380" y="180" width="320" height="185"/>
  <text class="letter" x="400" y="222">H</text>
  <text class="label" x="445" y="204">SORT BY IMPACT</text>
  <text class="small" x="445" y="224">Pick the three tasks that move your goals forward.</text>
  <text class="tiny" x="445" y="242">Urgency is not impact. Anchor choices to long-term value.</text>
  <text class="tiny" x="400" y="268">1.</text><line class="fillline" x1="420" y1="268" x2="670" y2="268"/>
  <text class="tiny" x="400" y="292">2.</text><line class="fillline" x1="420" y1="292" x2="670" y2="292"/>
  <text class="tiny" x="400" y="316">3.</text><line class="fillline" x1="420" y1="316" x2="670" y2="316"/>

  <rect class="box" x="720" y="180" width="320" height="185"/>
  <text class="letter" x="740" y="222">A</text>
  <text class="label" x="785" y="204">BLOCK PEAK HOURS</text>
  <text class="small" x="785" y="224">Place the top three tasks into early morning time blocks.</text>
  <text class="tiny" x="785" y="242">Block 90-120 minutes per task. Define exact start/end.</text>
  <text class="tiny" x="740" y="268">00:00 -</text><line class="fillline" x1="800" y1="268" x2="1010" y2="268"/>
  <text class="tiny" x="740" y="292">00:00 -</text><line class="fillline" x1="800" y1="292" x2="1010" y2="292"/>
  <text class="tiny" x="740" y="316">00:00 -</text><line class="fillline" x1="800" y1="316" x2="1010" y2="316"/>

  <rect class="box" x="40" y="380" width="500" height="185"/>
  <text class="letter" x="60" y="422">R</text>
  <text class="label" x="105" y="404">PROTECT FOCUS</text>
  <text class="small" x="105" y="424">Silence phone, close extra tabs, and set digital boundaries.</text>
  <text class="tiny" x="105" y="442">Write concrete protocols. Pre-plan deflection scripts.</text>
  <line class="fillline" x1="60" y1="470" x2="510" y2="470"/>
  <line class="fillline" x1="60" y1="500" x2="510" y2="500"/>
  <line class="fillline" x1="60" y1="530" x2="510" y2="530"/>

  <rect class="box" x="560" y="380" width="500" height="185"/>
  <text class="letter" x="580" y="422">T</text>
  <text class="label" x="625" y="404">REVIEW AND RESET</text>
  <text class="small" x="625" y="424">Audit progress before stopping work. Move only what matters.</text>
  <text class="tiny" x="625" y="442">Track completion rate. Adjust blocks based on daily data.</text>
  <text class="tiny" x="580" y="470">Done:</text><line class="fillline" x1="630" y1="470" x2="1030" y2="470"/>
  <text class="tiny" x="580" y="500">Carry:</text><line class="fillline" x1="630" y1="500" x2="1030" y2="500"/>
  <text class="tiny" x="580" y="530">Cut:</text><line class="fillline" x1="630" y1="530" x2="1030" y2="530"/>

  <rect class="mini" x="40" y="600" width="1020" height="88"/>
  <text class="label" x="60" y="626">FINAL COMMAND</text>
  <text class="small" x="60" y="650">A full schedule is not a victory. A controlled day is. The top three priorities I will execute tomorrow are:</text>
  <line class="fillline" x1="60" y1="674" x2="1030" y2="674"/>

  <rect class="mini" x="40" y="725" width="315" height="82"/>
  <text class="num" x="60" y="760">1</text>
  <text class="label" x="95" y="748">DUMP AND SORT</text>
  <text class="tiny" x="95" y="768">Clear your mind by listing every task, then rank by real impact.</text>
  <text class="tiny" x="95" y="784">Stop fighting loud urgency.</text>

  <rect class="mini" x="392" y="725" width="315" height="82"/>
  <text class="num" x="412" y="760">2</text>
  <text class="label" x="447" y="748">BLOCK AND SHIELD</text>
  <text class="tiny" x="447" y="768">Place top priorities into early morning slots.</text>
  <text class="tiny" x="447" y="784">Lock down your environment to prevent distractions.</text>

  <rect class="mini" x="745" y="725" width="315" height="82"/>
  <text class="num" x="765" y="760">3</text>
  <text class="label" x="800" y="748">REVIEW AND RESET</text>
  <text class="tiny" x="800" y="768">Check daily results, carry forward only what matters.</text>
  <text class="tiny" x="800" y="784">Cut the rest to build a repeatable rhythm.</text>
</svg>
