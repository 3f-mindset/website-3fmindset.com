<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img"
    aria-labelledby="title desc">
    <title id="title">SB26 Worksheet, Habit and Routine Audit</title>
    <desc id="desc">Landscape worksheet on a white background with large title, introduction,
        fillable sections built around the STRIKE action model, and a three step summary footer.</desc>

    <defs>
        <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .fillline { stroke: #9a9a9a; stroke-width: 1; }
      .dot { fill: #111111; }
      .lightfill { fill: #f7f7f7; stroke: #111111; stroke-width: 1.5; rx: 10; ry: 10; }
    </style>
    </defs>

    <rect class="bg" x="0" y="0" width="1100" height="850" />

    <text class="title" x="40" y="45">SB26 | HABIT AND ROUTINE AUDIT</text>
    <text class="sub" x="40" y="70">Refining Your Daily Forge</text>
    <text class="verb" x="870" y="55">STRIKE</text>

    <rect class="box" x="40" y="88" width="1020" height="70" />
    <text class="label" x="60" y="113">Choice</text>
    <text class="small" x="60" y="133">Keep letting the day decide for you, or inspect one real day,
        cut one weak block, and protect one strong block.</text>
    <text class="small" x="60" y="148">A routine is the Anvil. If the surface is weak, effort
        scatters. If the surface is stable, action becomes proof.</text>

    <rect class="box" x="40" y="180" width="320" height="500" />
    <text class="letter" x="60" y="220">S</text>
    <text class="label" x="105" y="205">SURVEY THE FULL DAY</text>
    <text class="tiny" x="105" y="222">Map yesterday from waking to sleeping. Use real time blocks.</text>

    <line class="soft" x1="62" y1="242" x2="338" y2="242" />
    <text class="tiny" x="65" y="258">TIME</text>
    <text class="tiny" x="130" y="258">WHAT HAPPENED</text>
    <text class="tiny" x="292" y="258">TAG</text>

    <line class="fillline" x1="65" y1="282" x2="120" y2="282" />
    <line class="fillline" x1="130" y1="282" x2="275" y2="282" />
    <rect class="mini" x="290" y="266" width="34" height="22" />

    <line class="fillline" x1="65" y1="318" x2="120" y2="318" />
    <line class="fillline" x1="130" y1="318" x2="275" y2="318" />
    <rect class="mini" x="290" y="302" width="34" height="22" />

    <line class="fillline" x1="65" y1="354" x2="120" y2="354" />
    <line class="fillline" x1="130" y1="354" x2="275" y2="354" />
    <rect class="mini" x="290" y="338" width="34" height="22" />

    <line class="fillline" x1="65" y1="390" x2="120" y2="390" />
    <line class="fillline" x1="130" y1="390" x2="275" y2="390" />
    <rect class="mini" x="290" y="374" width="34" height="22" />

    <line class="fillline" x1="65" y1="426" x2="120" y2="426" />
    <line class="fillline" x1="130" y1="426" x2="275" y2="426" />
    <rect class="mini" x="290" y="410" width="34" height="22" />

    <line class="fillline" x1="65" y1="462" x2="120" y2="462" />
    <line class="fillline" x1="130" y1="462" x2="275" y2="462" />
    <rect class="mini" x="290" y="446" width="34" height="22" />

    <line class="fillline" x1="65" y1="498" x2="120" y2="498" />
    <line class="fillline" x1="130" y1="498" x2="275" y2="498" />
    <rect class="mini" x="290" y="482" width="34" height="22" />

    <line class="fillline" x1="65" y1="534" x2="120" y2="534" />
    <line class="fillline" x1="130" y1="534" x2="275" y2="534" />
    <rect class="mini" x="290" y="518" width="34" height="22" />

    <line class="fillline" x1="65" y1="570" x2="120" y2="570" />
    <line class="fillline" x1="130" y1="570" x2="275" y2="570" />
    <rect class="mini" x="290" y="554" width="34" height="22" />

    <text class="tiny" x="65" y="610">Use H for high-value, N for neutral, L for low-value.</text>
    <text class="tiny" x="65" y="628">Do not write “busy.” Write what actually happened.</text>
    <text class="tiny" x="65" y="646">Best clue: which block left you later, weaker, or sharper?</text>

    <rect class="box" x="390" y="180" width="320" height="158" />
    <text class="letter" x="410" y="220">T</text>
    <text class="label" x="455" y="204">TAG THE PATTERN</text>
    <text class="tiny" x="455" y="222">Circle the blocks that shaped the day most.</text>

    <text class="small" x="415" y="253">Strongest high-value block:</text>
    <line class="fillline" x1="415" y1="273" x2="685" y2="273" />
    <text class="small" x="415" y="299">Weakest low-value block:</text>
    <line class="fillline" x1="415" y1="319" x2="685" y2="319" />

    <rect class="box" x="390" y="358" width="320" height="158" />
    <text class="letter" x="410" y="398">R</text>
    <text class="label" x="455" y="382">REMOVE THE WEAKEST LEAK</text>
    <text class="tiny" x="455" y="400">Choose one leak only. Make the rule physical and clear.</text>

    <text class="small" x="415" y="431">Trigger:</text>
    <line class="fillline" x1="465" y1="431" x2="685" y2="431" />
    <text class="small" x="415" y="461">Cost:</text>
    <line class="fillline" x1="455" y1="461" x2="685" y2="461" />
    <text class="small" x="415" y="491">Rule:</text>
    <line class="fillline" x1="455" y1="491" x2="685" y2="491" />

    <rect class="box" x="390" y="536" width="320" height="144" />
    <text class="letter" x="410" y="576">I</text>
    <text class="label" x="455" y="560">INSTALL A BETTER REPLACEMENT</text>
    <text class="tiny" x="455" y="578">Empty space refills with old habits. Give it a better job.</text>

    <text class="small" x="415" y="609">Old action:</text>
    <line class="fillline" x1="485" y1="609" x2="685" y2="609" />
    <text class="small" x="415" y="637">New action:</text>
    <line class="fillline" x1="490" y1="637" x2="685" y2="637" />
    <text class="small" x="415" y="665">Setup needed:</text>
    <line class="fillline" x1="505" y1="665" x2="685" y2="665" />

    <rect class="box" x="740" y="180" width="320" height="235" />
    <text class="letter" x="760" y="220">K</text>
    <text class="label" x="805" y="204">KEEP THE STRONG BLOCK PROTECTED</text>
    <text class="tiny" x="805" y="222">Do not only cut weakness. Defend what already works.</text>

    <text class="small" x="765" y="255">Strong block:</text>
    <line class="fillline" x1="850" y1="255" x2="1035" y2="255" />
    <text class="small" x="765" y="287">Why it works:</text>
    <line class="fillline" x1="850" y1="287" x2="1035" y2="287" />
    <text class="small" x="765" y="319">Threat:</text>
    <line class="fillline" x1="815" y1="319" x2="1035" y2="319" />
    <text class="small" x="765" y="351">Boundary:</text>
    <line class="fillline" x1="835" y1="351" x2="1035" y2="351" />
    <text class="small" x="765" y="383">Amplifier:</text>
    <line class="fillline" x1="835" y1="383" x2="1035" y2="383" />

    <rect class="box" x="740" y="435" width="320" height="245" />
    <text class="letter" x="760" y="475">E</text>
    <text class="label" x="805" y="459">EVALUATE AFTER SEVEN DAYS</text>
    <text class="tiny" x="805" y="477">A plan is not proof until the week tests it.</text>

    <text class="small" x="765" y="510">Seven-day test:</text>
    <line class="fillline" x1="865" y1="510" x2="1035" y2="510" />
    <text class="small" x="765" y="542">Daily mark:</text>
    <line class="fillline" x1="840" y1="542" x2="1035" y2="542" />
    <text class="small" x="765" y="574">Proof to watch:</text>
    <line class="fillline" x1="865" y1="574" x2="1035" y2="574" />
    <text class="small" x="765" y="606">Review date:</text>
    <line class="fillline" x1="845" y1="606" x2="1035" y2="606" />
    <text class="small" x="765" y="638">Next adjustment:</text>
    <line class="fillline" x1="870" y1="638" x2="1035" y2="638" />

    <path class="line" d="M360 430 C375 430 375 430 390 430" />
    <path class="line" d="M710 430 C725 430 725 430 740 430" />
    <circle class="dot" cx="376" cy="430" r="4" />
    <circle class="dot" cx="725" cy="430" r="4" />

    <rect class="box" x="40" y="705" width="1020" height="105" />
    <text class="label" x="60" y="730">Action Steps Summary</text>

    <circle class="line" cx="80" cy="765" r="20" />
    <text class="num" x="73" y="773">1</text>
    <text class="label" x="112" y="756">Map the Day</text>
    <text class="tiny" x="112" y="774">Track one full day hour by hour so the real pattern is
        visible.</text>

    <circle class="line" cx="405" cy="765" r="20" />
    <text class="num" x="398" y="773">2</text>
    <text class="label" x="437" y="756">Cut the Leak</text>
    <text class="tiny" x="437" y="774">Choose one low-value block and replace it with a repeatable
        action.</text>

    <circle class="line" cx="730" cy="765" r="20" />
    <text class="num" x="723" y="773">3</text>
    <text class="label" x="762" y="756">Protect the Fire</text>
    <text class="tiny" x="762" y="774">Defend one high-value block for seven days and review the
        proof.</text>

    <text class="tiny" x="60" y="800">Final check: One weak block cut. One strong block protected.
        One seven-day test chosen.</text>
</svg>