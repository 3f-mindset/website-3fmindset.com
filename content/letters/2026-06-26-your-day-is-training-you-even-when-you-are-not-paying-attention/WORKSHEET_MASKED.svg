<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img"
    aria-labelledby="title desc">
    <title id="title">SB26 Worksheet, Habit and Routine Audit</title>
    <desc id="desc">Landscape worksheet on a white background using the same layout as the original
        STRIKE worksheet, with the title and model letters preserved while all other content is
        replaced by light grayscale censor blocks.</desc>

    <defs>
        <style>
      .bg { fill: #ffffff; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.2; fill: none; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 28px; font-weight: 700; fill: #111111; }
      .verb { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; letter-spacing: 2px; }
      .letter { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; }
      .dot { fill: #111111; }

      .c1 { fill: #f3f3f3; }
      .c2 { fill: #ebebeb; }
      .c3 { fill: #e1e1e1; }
      .c4 { fill: #d7d7d7; }
      .c5 { fill: #cdcdcd; }

      .mask { rx: 6; ry: 6; }
      .maskr { rx: 10; ry: 10; }
      .maskpill { rx: 12; ry: 12; }
    </style>
    </defs>

    <rect class="bg" x="0" y="0" width="1100" height="850" />

    <!-- Title preserved -->
    <text class="title" x="40" y="45">SB26 | HABIT AND ROUTINE AUDIT</text>
    <text class="verb" x="870" y="55">STRIKE</text>

    <!-- Choice box -->
    <rect class="box" x="40" y="88" width="1020" height="70" />
    <rect class="c3 maskr" x="60" y="102" width="80" height="12" />
    <rect class="c2 mask" x="60" y="124" width="935" height="12" />
    <rect class="c4 mask" x="60" y="141" width="880" height="10" />

    <!-- S box -->
    <rect class="box" x="40" y="180" width="320" height="500" />
    <text class="letter" x="60" y="220">S</text>
