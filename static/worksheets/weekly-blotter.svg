    <text x="150" y="1267" class="section">How to Play</text>
    <text x="158" y="1317" class="small">• Set a winning score: 120+ = stable fire, 150+ = strong
        forging</text>
    <text x="158" y="1350" class="small">week, 200+ = elite discipline.</text>
    <text x="158" y="1393" class="small">• Stack the points when one action truly hits two
        categories.</text>
    <text x="158" y="1436" class="small">• Perfection is not the goal. Consistent heat is.</text>
    <text x="158" y="1479" class="small">• If you end a day with zero 10s, relight the fire first
        thing</text>
    <text x="158" y="1512" class="small">tomorrow.</text>
    <text x="150" y="1570" class="section">What the Scores Mean</text>
    <text x="158" y="1620" class="label">10</text>
    <text x="210" y="1620" class="small">Core Fire — Hearth and Furnace Stack. These keep
        life-support</text>
    <text x="210" y="1650" class="small">systems alive.</text>
    <text x="158" y="1695" class="label">5</text>
    <text x="210" y="1695" class="small">Hammer Strikes — deliberate actions that shape your
        discipline.</text>
    <text x="158" y="1750" class="label">2</text>
    <text x="210" y="1750" class="small">Grindstone Work — small refinements that sharpen your edge.</text>
    <text x="158" y="1805" class="label">1</text>
    <text x="210" y="1805" class="small">Slag Control — micro-maintenance that keeps the system
        clean.</text>
