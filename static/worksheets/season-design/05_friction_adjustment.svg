<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img"
    aria-labelledby="title desc">
    <title id="title">Friction and Adjustment Sheet</title>
    <desc id="desc">US letter landscape worksheet with white background, friction review, affected
        areas, cost audit, structural cause checklist, adjustment plan, and closing lesson.</desc>

    <defs>
        <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.3; rx: 8; ry: 8; }
      .softbox { fill: #f7f7f7; stroke: #111111; stroke-width: 1.4; rx: 14; ry: 14; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.1; fill: none; }
      .fillline { stroke: #999999; stroke-width: 1.1; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 31px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #111111; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 11.5px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 9.8px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 8.2px; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 19px; font-weight: 700; fill: #111111; }
      .bigword { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 700; fill: #111111; letter-spacing: 1.4px; }
      .check { fill: #ffffff; stroke: #111111; stroke-width: 1.2; }
    </style>
    </defs>

    <rect class="bg" x="0" y="0" width="1100" height="850" />

    <text class="title" x="40" y="45">FRICTION AND ADJUSTMENT SHEET</text>
    <text class="sub" x="40" y="70">Turn Compromise, Delay, Avoidance, or Overcarrying Into
        Structure</text>
    <text class="bigword" x="770" y="55">NAME THE FRICTION</text>

    <rect class="box" x="40" y="88" width="1020" height="76" />
    <text class="label" x="60" y="113">Choice</text>
    <text class="small" x="60" y="132">Friction is evidence. Use it to find the weak point in the
        system, then make one clear adjustment.</text>
    <text class="small" x="60" y="149">Describe what happened without judgment. Name the cost. Find
        the missing structure. Choose the next visible action.</text>

    <rect class="softbox" x="750" y="103" width="280" height="45" />
    <text class="label" x="768" y="122">Date:</text>
    <line class="fillline" x1="810" y1="122" x2="1012" y2="122" />
    <text class="label" x="768" y="143">Role or Container:</text>
    <line class="fillline" x1="888" y1="143" x2="1012" y2="143" />

    <rect class="box" x="40" y="185" width="330" height="155" />
    <text class="num" x="60" y="218">1</text>
    <text class="label" x="92" y="205">WHAT HAPPENED</text>
    <text class="tiny" x="92" y="222">Describe the event without judgment.</text>
    <line class="fillline" x1="65" y1="252" x2="345" y2="252" />
    <line class="fillline" x1="65" y1="280" x2="345" y2="280" />
    <line class="fillline" x1="65" y1="308" x2="345" y2="308" />
    <text class="tiny" x="65" y="329">Write the facts first. Meaning comes after clarity.</text>

    <rect class="box" x="400" y="185" width="320" height="155" />
    <text class="num" x="420" y="218">2</text>
    <text class="label" x="452" y="205">INTENTION AND ACTION</text>
    <text class="tiny" x="452" y="222">Compare what you meant to do with what happened.</text>
    <text class="small" x="425" y="252">What I intended:</text>
    <line class="fillline" x1="532" y1="252" x2="695" y2="252" />
    <line class="fillline" x1="425" y1="280" x2="695" y2="280" />
    <text class="small" x="425" y="308">What I actually did:</text>
    <line class="fillline" x1="548" y1="308" x2="695" y2="308" />
    <line class="fillline" x1="425" y1="329" x2="695" y2="329" />

    <rect class="box" x="750" y="185" width="310" height="155" />
    <text class="num" x="770" y="218">3</text>
    <text class="label" x="802" y="205">STORY AND PROTECTION</text>
    <text class="tiny" x="802" y="222">Find the inner story that was active.</text>
    <text class="small" x="775" y="252">What story was active?</text>
    <line class="fillline" x1="912" y1="252" x2="1035" y2="252" />
    <line class="fillline" x1="775" y1="280" x2="1035" y2="280" />
    <text class="small" x="775" y="308">What was I trying to protect?</text>
    <line class="fillline" x1="945" y1="308" x2="1035" y2="308" />
    <line class="fillline" x1="775" y1="329" x2="1035" y2="329" />

    <rect class="box" x="40" y="365" width="330" height="175" />
    <text class="num" x="60" y="398">4</text>
    <text class="label" x="92" y="385">WHERE FRICTION SHOWED UP</text>
    <text class="tiny" x="92" y="402">Check every area touched by the compromise.</text>

    <rect class="check" x="65" y="420" width="10" height="10" />
    <text class="tiny" x="82" y="429">Rest</text>
    <rect class="check" x="165" y="420" width="10" height="10" />
    <text class="tiny" x="182" y="429">Restoration</text>
    <rect class="check" x="270" y="420" width="10" height="10" />
    <text class="tiny" x="287" y="429">Relief</text>

    <rect class="check" x="65" y="444" width="10" height="10" />
    <text class="tiny" x="82" y="453">Son</text>
    <rect class="check" x="165" y="444" width="10" height="10" />
    <text class="tiny" x="182" y="453">Partner</text>
    <rect class="check" x="270" y="444" width="10" height="10" />
    <text class="tiny" x="287" y="453">Publisher</text>

    <rect class="check" x="65" y="468" width="10" height="10" />
    <text class="tiny" x="82" y="477">Career</text>
    <rect class="check" x="165" y="468" width="10" height="10" />
    <text class="tiny" x="182" y="477">Friend</text>
    <rect class="check" x="270" y="468" width="10" height="10" />
    <text class="tiny" x="287" y="477">Driver</text>

    <rect class="check" x="65" y="492" width="10" height="10" />
    <text class="tiny" x="82" y="501">Self</text>
    <rect class="check" x="165" y="492" width="10" height="10" />
    <text class="tiny" x="182" y="501">Boundary</text>
    <rect class="check" x="270" y="492" width="10" height="10" />
    <text class="tiny" x="287" y="501">Calendar</text>

    <rect class="check" x="65" y="516" width="10" height="10" />
    <text class="tiny" x="82" y="525">Physical commitment</text>
    <rect class="check" x="198" y="516" width="10" height="10" />
    <text class="tiny" x="215" y="525">Avoidance</text>
    <rect class="check" x="285" y="516" width="10" height="10" />
    <text class="tiny" x="302" y="525">Overfunctioning</text>

    <rect class="box" x="400" y="365" width="320" height="175" />
    <text class="num" x="420" y="398">5</text>
    <text class="label" x="452" y="385">COST AUDIT</text>
    <text class="tiny" x="452" y="402">Name what the friction consumed.</text>

    <text class="small" x="425" y="430">Time:</text>
    <line class="fillline" x1="465" y1="430" x2="695" y2="430" />
    <text class="small" x="425" y="456">Energy:</text>
    <line class="fillline" x1="475" y1="456" x2="695" y2="456" />
    <text class="small" x="425" y="482">Peace:</text>
    <line class="fillline" x1="470" y1="482" x2="695" y2="482" />
    <text class="small" x="425" y="508">Connection:</text>
    <line class="fillline" x1="500" y1="508" x2="695" y2="508" />
    <text class="small" x="425" y="532">Progress:</text>
    <line class="fillline" x1="485" y1="532" x2="695" y2="532" />

    <rect class="box" x="750" y="365" width="310" height="175" />
    <text class="num" x="770" y="398">6</text>
    <text class="label" x="802" y="385">SERVICE TO AIM</text>
    <text class="tiny" x="802" y="402">Test the request, habit, or reaction against the aim.</text>

    <text class="small" x="775" y="430">What was this in service to?</text>
    <line class="fillline" x1="775" y1="456" x2="1035" y2="456" />
    <line class="fillline" x1="775" y1="484" x2="1035" y2="484" />
    <text class="small" x="775" y="512">Did it serve my aim?</text>
    <text class="tiny" x="900" y="512">Yes / No</text>
    <text class="small" x="775" y="532">Why:</text>
    <line class="fillline" x1="810" y1="532" x2="1035" y2="532" />

    <rect class="box" x="40" y="565" width="500" height="125" />
    <text class="num" x="60" y="598">7</text>
    <text class="label" x="92" y="585">STRUCTURAL CAUSE</text>
    <text class="tiny" x="92" y="602">What part of the system was missing or weak?</text>

    <rect class="check" x="65" y="620" width="10" height="10" />
    <text class="tiny" x="82" y="629">No protected time</text>
    <rect class="check" x="225" y="620" width="10" height="10" />
    <text class="tiny" x="242" y="629">No clear boundary</text>
    <rect class="check" x="385" y="620" width="10" height="10" />
    <text class="tiny" x="402" y="629">No review point</text>

    <rect class="check" x="65" y="644" width="10" height="10" />
    <text class="tiny" x="82" y="653">No recovery plan</text>
    <rect class="check" x="225" y="644" width="10" height="10" />
    <text class="tiny" x="242" y="653">No support requested</text>
    <rect class="check" x="385" y="644" width="10" height="10" />
    <text class="tiny" x="402" y="653">No clear next action</text>

    <rect class="check" x="65" y="668" width="10" height="10" />
    <text class="tiny" x="82" y="677">Too many open commitments</text>
    <rect class="check" x="225" y="668" width="10" height="10" />
    <text class="tiny" x="242" y="677">Relief uncontained</text>
    <rect class="check" x="385" y="668" width="10" height="10" />
    <text class="tiny" x="402" y="677">Rest compromised</text>

    <rect class="box" x="570" y="565" width="490" height="125" />
    <text class="num" x="590" y="598">8</text>
    <text class="label" x="622" y="585">ADJUSTMENT PLAN</text>
    <text class="tiny" x="622" y="602">Turn the lesson into one visible change.</text>

    <text class="small" x="595" y="628">Adjustment needed:</text>
    <line class="fillline" x1="710" y1="628" x2="1035" y2="628" />
    <text class="small" x="595" y="654">New rule or boundary:</text>
    <line class="fillline" x1="730" y1="654" x2="1035" y2="654" />
    <text class="small" x="595" y="680">Next visible action within 24 hours:</text>
    <line class="fillline" x1="790" y1="680" x2="1035" y2="680" />

    <rect class="box" x="40" y="715" width="1020" height="95" />
    <text class="label" x="60" y="740">What I Will Track Going Forward:</text>
    <line class="fillline" x1="265" y1="740" x2="620" y2="740" />
    <text class="label" x="650" y="740">Closing Line:</text>
    <text class="small" x="745" y="740">The lesson from this friction is:</text>
    <line class="fillline" x1="915" y1="740" x2="1035" y2="740" />

    <circle class="line" cx="80" cy="780" r="17" />
    <text class="num" x="75" y="787">1</text>
    <text class="label" x="110" y="775">Name the Event</text>
    <text class="tiny" x="110" y="792">Describe what happened without judgment.</text>

    <circle class="line" cx="405" cy="780" r="17" />
    <text class="num" x="400" y="787">2</text>
    <text class="label" x="435" y="775">Find the Weak Point</text>
    <text class="tiny" x="435" y="792">Identify the missing structure behind the friction.</text>

    <circle class="line" cx="730" cy="780" r="17" />
    <text class="num" x="725" y="787">3</text>
    <text class="label" x="760" y="775">Install the Adjustment</text>
    <text class="tiny" x="760" y="792">Choose one rule, one action, and one thing to track.</text>
</svg>