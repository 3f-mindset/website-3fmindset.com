<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">Weekly Container Plan Worksheet</title>
  <desc id="desc">US letter landscape worksheet with white background, weekly aim, rest, restoration, relief, responsibility containers, refusal prompts, and end of week review fields.</desc>

  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .mini { fill: #ffffff; stroke: #111111; stroke-width: 1.4; rx: 9; ry: 9; }
      .softbox { fill: #f7f7f7; stroke: #111111; stroke-width: 1.4; rx: 14; ry: 14; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .soft { stroke: #777777; stroke-width: 1.1; fill: none; }
      .fillline { stroke: #999999; stroke-width: 1.1; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 31px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #111111; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 10px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 8.5px; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #111111; }
      .bigword { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 700; fill: #111111; letter-spacing: 1.4px; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="850"/>

  <text class="title" x="40" y="45">WEEKLY CONTAINER PLAN</text>
  <text class="sub" x="40" y="70">Shape the Week Before Pressure Shapes It</text>
  <text class="bigword" x="760" y="55">CONTAIN THE WEEK</text>

  <rect class="box" x="40" y="88" width="1020" height="76"/>
  <text class="label" x="60" y="113">Choice</text>
  <text class="small" x="60" y="132">This week will either be shaped by pressure or contained by commitment. Choose the aim before requests arrive.</text>
  <text class="small" x="60" y="149">Before saying yes, ask: What is this in service to? Then protect rest, restoration, relief, and responsibility with visible blocks.</text>

  <rect class="softbox" x="735" y="103" width="295" height="45"/>
  <text class="label" x="752" y="122">Week Number:</text>
  <line class="fillline" x1="848" y1="122" x2="1012" y2="122"/>
  <text class="label" x="752" y="143">Dates:</text>
  <text class="tiny" x="795" y="143">Start</text>
  <line class="fillline" x1="825" y1="143" x2="910" y2="143"/>
  <text class="tiny" x="920" y="143">End</text>
  <line class="fillline" x1="945" y1="143" x2="1012" y2="143"/>

  <rect class="box" x="40" y="185" width="330" height="155"/>
  <text class="num" x="60" y="218">1</text>
  <text class="label" x="92" y="205">THIS WEEK'S AIM</text>
  <text class="tiny" x="92" y="222">Name the direction that governs the week.</text>
  <line class="fillline" x1="65" y1="250" x2="345" y2="250"/>
  <line class="fillline" x1="65" y1="278" x2="345" y2="278"/>
  <text class="label" x="65" y="307">Top 3 Priorities</text>
  <text class="small" x="65" y="328">1.</text><line class="fillline" x1="88" y1="328" x2="345" y2="328"/>
  <text class="small" x="215" y="328">2.</text><line class="fillline" x1="238" y1="328" x2="345" y2="328"/>

  <rect class="box" x="400" y="185" width="320" height="155"/>
  <text class="num" x="420" y="218">2</text>
  <text class="label" x="452" y="205">REST CONTAINER</text>
  <text class="tiny" x="452" y="222">Protect capacity before the week spends it.</text>
  <text class="small" x="425" y="250">Screens off target:</text>
  <line class="fillline" x1="540" y1="250" x2="615" y2="250"/>
  <text class="small" x="625" y="250">nights</text>
  <text class="small" x="425" y="276">Lights out target:</text>
  <line class="fillline" x1="530" y1="276" x2="615" y2="276"/>
  <text class="small" x="625" y="276">nights</text>
  <text class="small" x="425" y="304">Protected sleep blocks:</text>
  <text class="tiny" x="425" y="323">M</text><line class="fillline" x1="442" y1="323" x2="485" y2="323"/>
  <text class="tiny" x="495" y="323">T</text><line class="fillline" x1="510" y1="323" x2="553" y2="323"/>
  <text class="tiny" x="563" y="323">W</text><line class="fillline" x1="583" y1="323" x2="626" y2="323"/>
  <text class="tiny" x="636" y="323">Th</text><line class="fillline" x1="657" y1="323" x2="700" y2="323"/>

  <rect class="box" x="750" y="185" width="310" height="155"/>
  <text class="num" x="770" y="218">3</text>
  <text class="label" x="802" y="205">RESTORATION CONTAINER</text>
  <text class="tiny" x="802" y="222">Plan what gives energy back.</text>
  <text class="small" x="775" y="250">Morning walks:</text>
  <text class="tiny" x="775" y="276">Day 1</text><line class="fillline" x1="820" y1="276" x2="900" y2="276"/>
  <text class="tiny" x="910" y="276">Day 2</text><line class="fillline" x1="955" y1="276" x2="1035" y2="276"/>
  <text class="tiny" x="775" y="304">Day 3</text><line class="fillline" x1="820" y1="304" x2="900" y2="304"/>
  <text class="small" x="775" y="330">Energy giving activity:</text>
  <line class="fillline" x1="905" y1="330" x2="1035" y2="330"/>

  <rect class="box" x="40" y="365" width="330" height="155"/>
  <text class="num" x="60" y="398">4</text>
  <text class="label" x="92" y="385">RELIEF CONTAINER</text>
  <text class="tiny" x="92" y="402">Contain pressure without letting relief become escape.</text>
  <text class="small" x="65" y="430">Expected pressure points:</text>
  <line class="fillline" x1="65" y1="450" x2="345" y2="450"/>
  <text class="small" x="65" y="477">Planned decompression blocks:</text>
  <line class="fillline" x1="65" y1="497" x2="345" y2="497"/>
  <text class="small" x="65" y="512">Phone or game limit:</text>
  <line class="fillline" x1="185" y1="512" x2="345" y2="512"/>

  <rect class="box" x="400" y="365" width="660" height="155"/>
  <text class="num" x="420" y="398">5</text>
  <text class="label" x="452" y="385">RESPONSIBILITY CONTAINERS</text>
  <text class="tiny" x="452" y="402">Give each role a clear action and a clear boundary.</text>

  <text class="label" x="425" y="430">Son</text>
  <text class="tiny" x="425" y="450">Action:</text><line class="fillline" x1="470" y1="450" x2="610" y2="450"/>
  <text class="tiny" x="425" y="475">Boundary:</text><line class="fillline" x1="485" y1="475" x2="610" y2="475"/>

  <text class="label" x="635" y="430">Partner</text>
  <text class="tiny" x="635" y="450">Action:</text><line class="fillline" x1="680" y1="450" x2="820" y2="450"/>
  <text class="tiny" x="635" y="475">Connection:</text><line class="fillline" x1="705" y1="475" x2="820" y2="475"/>

  <text class="label" x="845" y="430">Publisher</text>
  <text class="tiny" x="845" y="450">Action:</text><line class="fillline" x1="890" y1="450" x2="1035" y2="450"/>
  <text class="tiny" x="845" y="475">New yes question:</text><line class="fillline" x1="940" y1="475" x2="1035" y2="475"/>

  <text class="label" x="425" y="502">Career</text>
  <text class="tiny" x="475" y="502">Action:</text><line class="fillline" x1="520" y1="502" x2="685" y2="502"/>
  <text class="label" x="710" y="502">Friend</text>
  <text class="tiny" x="760" y="502">Action:</text><line class="fillline" x1="805" y1="502" x2="930" y2="502"/>
  <text class="tiny" x="940" y="502">24 hr calls:</text>
  <text class="tiny" x="1000" y="502">Y / N</text>

  <rect class="box" x="40" y="545" width="330" height="145"/>
  <text class="num" x="60" y="578">6</text>
  <text class="label" x="92" y="565">DRIVER AND SELF</text>
  <text class="tiny" x="92" y="582">Keep planning, movement, and review inside the week.</text>
  <text class="small" x="65" y="612">Driver planning block:</text>
  <line class="fillline" x1="195" y1="612" x2="345" y2="612"/>
  <text class="small" x="65" y="638">Driver review block:</text>
  <line class="fillline" x1="188" y1="638" x2="345" y2="638"/>
  <text class="small" x="65" y="664">Movement plan:</text>
  <line class="fillline" x1="160" y1="664" x2="345" y2="664"/>
  <text class="small" x="65" y="684">Strength or mobility:</text>
  <line class="fillline" x1="190" y1="684" x2="345" y2="684"/>

  <rect class="box" x="400" y="545" width="320" height="145"/>
  <text class="num" x="420" y="578">7</text>
  <text class="label" x="452" y="565">WEIGHT AUDIT</text>
  <text class="tiny" x="452" y="582">Separate refusal, responsibility, and overcarrying.</text>
  <text class="small" x="425" y="612">What I must refuse:</text>
  <line class="fillline" x1="545" y1="612" x2="695" y2="612"/>
  <line class="fillline" x1="425" y1="632" x2="695" y2="632"/>
  <text class="small" x="425" y="658">What I must carry:</text>
  <line class="fillline" x1="540" y1="658" x2="695" y2="658"/>
  <text class="small" x="425" y="684">What I must stop overcarrying:</text>
  <line class="fillline" x1="615" y1="684" x2="695" y2="684"/>

  <rect class="box" x="750" y="545" width="310" height="145"/>
  <text class="num" x="770" y="578">8</text>
  <text class="label" x="802" y="565">END OF WEEK REVIEW</text>
  <text class="tiny" x="802" y="582">Set the review before the week begins.</text>
  <text class="small" x="775" y="614">Day:</text>
  <line class="fillline" x1="810" y1="614" x2="930" y2="614"/>
  <text class="small" x="945" y="614">Time:</text>
  <line class="fillline" x1="985" y1="614" x2="1035" y2="614"/>
  <text class="small" x="775" y="647">Planned in-person event:</text>
  <line class="fillline" x1="915" y1="647" x2="1035" y2="647"/>
  <text class="small" x="775" y="676">Rule for relief:</text>
  <line class="fillline" x1="865" y1="676" x2="1035" y2="676"/>

  <path class="line" d="M370 262 C385 262 385 262 400 262"/>
  <path class="line" d="M720 262 C735 262 735 262 750 262"/>
  <path class="line" d="M370 450 C385 450 385 450 400 450"/>
  <path class="line" d="M720 620 C735 620 735 620 750 620"/>
  <circle cx="385" cy="262" r="4" fill="#111111"/>
  <circle cx="735" cy="262" r="4" fill="#111111"/>
  <circle cx="385" cy="450" r="4" fill="#111111"/>
  <circle cx="735" cy="620" r="4" fill="#111111"/>

  <rect class="box" x="40" y="715" width="1020" height="95"/>
  <text class="label" x="60" y="740">Action Steps Summary</text>

  <circle class="line" cx="80" cy="772" r="19"/>
  <text class="num" x="74" y="780">1</text>
  <text class="label" x="112" y="765">Set the Aim</text>
  <text class="tiny" x="112" y="783">Write the weekly aim and use one question before every new yes.</text>

  <circle class="line" cx="405" cy="772" r="19"/>
  <text class="num" x="399" y="780">2</text>
  <text class="label" x="437" y="765">Build the Containers</text>
  <text class="tiny" x="437" y="783">Block rest, restoration, relief, and each key role before pressure arrives.</text>

  <circle class="line" cx="730" cy="772" r="19"/>
  <text class="num" x="724" y="780">3</text>
  <text class="label" x="762" y="765">Review the Proof</text>
  <text class="tiny" x="762" y="783">Name what you carried, refused, overcarried, and will adjust next week.</text>

  <text class="tiny" x="60" y="802">Final check: Aim named. Priorities chosen. Rest protected. Relief contained. Roles assigned. Review scheduled.</text>
</svg>