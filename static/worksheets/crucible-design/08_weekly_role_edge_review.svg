<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">Weekly Role Review</title>
  <desc id="desc">A printable end-of-week review for up to three domain and role combinations, with observable evidence, planned action completion, helpful and needed or overused Edges, an across-role pattern, and one next-week practice.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .softbox { fill: #f7f7f7; stroke: #111111; stroke-width: 1.4; rx: 14; ry: 14; }
      .fillline { stroke: #999999; stroke-width: 1.1; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 31px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #111111; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 10px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 8.5px; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #111111; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1100" height="850"/>
  <text class="title" x="40" y="45">WEEKLY ROLE REVIEW</text>
  <text class="sub" x="40" y="70">Notice how you showed up; let evidence guide what comes next.</text>
  <text class="label" x="790" y="50">WEEK OF:</text>
  <line class="fillline" x1="860" y1="50" x2="1055" y2="50"/>

  <rect class="softbox" x="40" y="88" width="1020" height="58"/>
  <text class="small" x="60" y="111">Domains are where you focus; roles are how you participate; Edges are qualities you bring to a role.</text>
  <text class="small" x="60" y="130">Review up to three roles. Record observable evidence, not a verdict on your worth. Leave unused spaces blank.</text>

  <rect class="box" x="40" y="163" width="325" height="370"/>
  <text class="num" x="60" y="194">1</text><text class="label" x="92" y="183">DOMAIN + ROLE</text>
  <text class="tiny" x="60" y="218">Domain</text><line class="fillline" x1="60" y1="239" x2="345" y2="239"/>
  <text class="tiny" x="60" y="261">Role</text><line class="fillline" x1="60" y1="282" x2="345" y2="282"/>
  <text class="small" x="60" y="307">Observable evidence: what I did / said</text>
  <line class="fillline" x1="60" y1="332" x2="345" y2="332"/><line class="fillline" x1="60" y1="353" x2="345" y2="353"/>
  <text class="small" x="60" y="378">Planned action happened?</text><text class="tiny" x="219" y="378">□ Yes  □ Partly  □ Not yet  □ N/A</text>
  <text class="small" x="60" y="408">Edge(s) that helped:</text><line class="fillline" x1="60" y1="432" x2="345" y2="432"/>
  <text class="small" x="60" y="457">Lacking / needed or overused:</text>
  <line class="fillline" x1="60" y1="481" x2="345" y2="481"/><line class="fillline" x1="60" y1="505" x2="345" y2="505"/>

  <rect class="box" x="387" y="163" width="325" height="370"/>
  <text class="num" x="407" y="194">2</text><text class="label" x="439" y="183">DOMAIN + ROLE</text>
  <text class="tiny" x="407" y="218">Domain</text><line class="fillline" x1="407" y1="239" x2="692" y2="239"/>
  <text class="tiny" x="407" y="261">Role</text><line class="fillline" x1="407" y1="282" x2="692" y2="282"/>
  <text class="small" x="407" y="307">Observable evidence: what I did / said</text>
  <line class="fillline" x1="407" y1="332" x2="692" y2="332"/><line class="fillline" x1="407" y1="353" x2="692" y2="353"/>
  <text class="small" x="407" y="378">Planned action happened?</text><text class="tiny" x="566" y="378">□ Yes  □ Partly  □ Not yet  □ N/A</text>
  <text class="small" x="407" y="408">Edge(s) that helped:</text><line class="fillline" x1="407" y1="432" x2="692" y2="432"/>
  <text class="small" x="407" y="457">Lacking / needed or overused:</text>
  <line class="fillline" x1="407" y1="481" x2="692" y2="481"/><line class="fillline" x1="407" y1="505" x2="692" y2="505"/>

  <rect class="box" x="734" y="163" width="326" height="370"/>
  <text class="num" x="754" y="194">3</text><text class="label" x="786" y="183">DOMAIN + ROLE</text>
  <text class="tiny" x="754" y="218">Domain</text><line class="fillline" x1="754" y1="239" x2="1040" y2="239"/>
  <text class="tiny" x="754" y="261">Role</text><line class="fillline" x1="754" y1="282" x2="1040" y2="282"/>
  <text class="small" x="754" y="307">Observable evidence: what I did / said</text>
  <line class="fillline" x1="754" y1="332" x2="1040" y2="332"/><line class="fillline" x1="754" y1="353" x2="1040" y2="353"/>
  <text class="small" x="754" y="378">Planned action happened?</text><text class="tiny" x="913" y="378">□ Yes  □ Partly  □ Not yet  □ N/A</text>
  <text class="small" x="754" y="408">Edge(s) that helped:</text><line class="fillline" x1="754" y1="432" x2="1040" y2="432"/>
  <text class="small" x="754" y="457">Lacking / needed or overused:</text>
  <line class="fillline" x1="754" y1="481" x2="1040" y2="481"/><line class="fillline" x1="754" y1="505" x2="1040" y2="505"/>

  <rect class="softbox" x="40" y="550" width="1020" height="82"/>
  <text class="label" x="58" y="574">NINE EDGES</text>
  <text class="small" x="58" y="598">Direction  •  Craft  •  Alignment  •  Stewardship  •  Adaptation</text>
  <text class="small" x="58" y="618">Service  •  Legacy  •  Integration  •  Expression</text>
  <text class="tiny" x="650" y="598">Choose what fits; no rating is needed.</text>

  <rect class="box" x="40" y="650" width="495" height="158"/>
  <text class="label" x="60" y="677">PATTERN ACROSS ROLES</text>
  <text class="small" x="60" y="704">What Edge or behavior showed up more than once?</text>
  <line class="fillline" x1="60" y1="728" x2="515" y2="728"/><line class="fillline" x1="60" y1="751" x2="515" y2="751"/>
  <text class="tiny" x="60" y="780">What would you like to keep, balance, or repair?</text>
  <line class="fillline" x1="60" y1="798" x2="515" y2="798"/>
  <rect class="box" x="555" y="650" width="505" height="158"/>
  <text class="label" x="575" y="677">ONE NEXT-WEEK ROLE / EDGE PRACTICE</text>
  <text class="small" x="575" y="704">In domain / role:</text><line class="fillline" x1="670" y1="704" x2="1035" y2="704"/>
  <text class="small" x="575" y="735">I will practice this Edge by doing:</text>
  <line class="fillline" x1="575" y1="760" x2="1035" y2="760"/><line class="fillline" x1="575" y1="786" x2="1035" y2="786"/>
</svg>
