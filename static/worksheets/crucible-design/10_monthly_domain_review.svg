<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">Monthly Domain Review</title>
  <desc id="desc">Landscape worksheet synthesizing Visionary Domains, Weekly Domain Plan, Weekly Domain Blotter, Weekly Role Review, and Weekly Recalibration into next-month priorities.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .softbox { fill: #f7f7f7; stroke: #111111; stroke-width: 1.4; rx: 14; ry: 14; }
      .fillline { stroke: #999999; stroke-width: 1.1; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 31px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #111111; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 9px; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #111111; }
      .bigword { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #111111; letter-spacing: 1px; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1100" height="850"/>
  <text class="title" x="40" y="45">MONTHLY DOMAIN REVIEW</text>
  <text class="sub" x="40" y="70">Evidence for the next season of action</text>
  <text class="bigword" x="700" y="55">REVIEW · CHOOSE</text>
  <rect class="box" x="40" y="88" width="1020" height="78"/>
  <text class="label" x="60" y="113">Monthly synthesis</text>
  <text class="small" x="60" y="132">Domains are focus areas; Edges are qualities you bring. Use Visionary Domains, Weekly Domain Plan,</text>
  <text class="small" x="60" y="150">Weekly Domain Blotter, Weekly Role Review, and Weekly Recalibration as evidence—not a verdict.</text>
  <rect class="softbox" x="760" y="103" width="270" height="45"/>
  <text class="label" x="778" y="122">Month:</text><line class="fillline" x1="830" y1="122" x2="1012" y2="122"/>
  <text class="label" x="778" y="143">Weeks:</text><line class="fillline" x1="830" y1="143" x2="895" y2="143"/><text class="small" x="902" y="146">through</text><line class="fillline" x1="950" y1="143" x2="1012" y2="143"/>

  <rect class="box" x="40" y="185" width="315" height="180"/>
  <text class="num" x="60" y="220">1</text><text class="label" x="92" y="207">AIM &amp; DOMAIN EVIDENCE</text>
  <text class="tiny" x="92" y="224">Compare Visionary Domains with the calendar and weekly actions.</text>
  <text class="small" x="65" y="251">Domain(s) in focus:</text><line class="fillline" x1="170" y1="251" x2="330" y2="251"/>
  <text class="small" x="65" y="280">What time/actions aligned?</text><line class="fillline" x1="65" y1="301" x2="330" y2="301"/>
  <text class="small" x="65" y="328">Gap or meaningful progress:</text><line class="fillline" x1="65" y1="349" x2="330" y2="349"/>

  <rect class="box" x="392" y="185" width="315" height="180"/>
  <text class="num" x="412" y="220">2</text><text class="label" x="444" y="207">CAPACITY &amp; RESTORATION</text>
  <text class="tiny" x="444" y="224">Notice conditions, not character flaws.</text>
  <text class="small" x="417" y="251">Capacity / rest that helped:</text><line class="fillline" x1="417" y1="273" x2="682" y2="273"/>
  <text class="small" x="417" y="301">Relief, recovery, or support needed:</text><line class="fillline" x1="417" y1="323" x2="682" y2="323"/>
  <text class="small" x="417" y="350">Adjustment:</text><line class="fillline" x1="490" y1="350" x2="682" y2="350"/>

  <rect class="box" x="745" y="185" width="315" height="180"/>
  <text class="num" x="765" y="220">3</text><text class="label" x="797" y="207">ROLE &amp; EDGE PATTERNS</text>
  <text class="tiny" x="797" y="224">Weekly Role Reviews: evidence, no rating score.</text>
  <text class="small" x="770" y="250">Responsibility / role evidence:</text><line class="fillline" x1="770" y1="271" x2="1035" y2="271"/>
  <text class="small" x="770" y="296">Edges helped / felt lacking:</text><line class="fillline" x1="770" y1="317" x2="1035" y2="317"/>
  <text class="small" x="770" y="342">Overused strength / pattern:</text><line class="fillline" x1="770" y1="358" x2="1035" y2="358"/>

  <rect class="box" x="40" y="390" width="315" height="190"/>
  <text class="num" x="60" y="425">4</text><text class="label" x="92" y="412">AGENCY &amp; FRICTION</text>
  <text class="tiny" x="92" y="429">Weekly Recalibration: what pressure repeated?</text>
  <text class="small" x="65" y="458">Where did I have agency?</text><line class="fillline" x1="65" y1="480" x2="330" y2="480"/>
  <text class="small" x="65" y="509">Pressure / recurring friction:</text><line class="fillline" x1="65" y1="531" x2="330" y2="531"/>
  <text class="small" x="65" y="563">Structural cause or support:</text><line class="fillline" x1="65" y1="578" x2="330" y2="578"/>

  <rect class="box" x="392" y="390" width="668" height="190"/>
  <text class="label" x="412" y="418">5  NEXT-MONTH CHOICE</text>
  <text class="tiny" x="412" y="436">Choose up to three; mark carry / change / defer. Rename or combine to fit your life.</text>
  <text class="small" x="412" y="464">Priority 1 domain / role:</text><line class="fillline" x1="550" y1="464" x2="760" y2="464"/><text class="small" x="778" y="464">Carry / change / defer:</text><line class="fillline" x1="915" y1="464" x2="1035" y2="464"/>
  <text class="small" x="412" y="492">Priority 2 domain / role:</text><line class="fillline" x1="550" y1="492" x2="760" y2="492"/><text class="small" x="778" y="492">Carry / change / defer:</text><line class="fillline" x1="915" y1="492" x2="1035" y2="492"/>
  <text class="small" x="412" y="520">Priority 3 domain / role:</text><line class="fillline" x1="550" y1="520" x2="760" y2="520"/><text class="small" x="778" y="520">Carry / change / defer:</text><line class="fillline" x1="915" y1="520" x2="1035" y2="520"/>
  <text class="small" x="412" y="548">Outcome / milestone:</text><line class="fillline" x1="540" y1="548" x2="760" y2="548"/><text class="small" x="778" y="548">Support rhythm / boundary:</text><line class="fillline" x1="930" y1="548" x2="1035" y2="548"/>
  <text class="small" x="412" y="570">Visible action:</text><line class="fillline" x1="500" y1="570" x2="760" y2="570"/>

  <rect class="box" x="40" y="600" width="1020" height="90"/>
  <text class="label" x="60" y="626">Edge reference · qualities to notice, not score</text>
  <text class="small" x="60" y="650">Direction · Craft · Alignment · Stewardship · Adaptation · Service · Legacy · Integration · Expression</text>
  <text class="small" x="60" y="675">Which repeated pattern matters to your chosen priorities? Keep other domains in maintenance or deferred, not forgotten.</text>

  <rect class="box" x="40" y="715" width="1020" height="95"/>
  <text class="label" x="60" y="740">Action Steps Summary</text>
  <text class="label" x="60" y="765">Monthly review point:</text><line class="fillline" x1="190" y1="765" x2="370" y2="765"/>
  <text class="label" x="400" y="765">Next weekly plan:</text><line class="fillline" x1="510" y1="765" x2="700" y2="765"/>
  <text class="label" x="730" y="765">First visible step:</text><line class="fillline" x1="840" y1="765" x2="1035" y2="765"/>
  <text class="tiny" x="60" y="790">Carry evidence and chosen priorities into the Weekly Domain Plan; review and adjust when the month or your circumstances call for it.</text>
</svg>
