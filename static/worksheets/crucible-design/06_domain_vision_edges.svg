<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">Visionary Domains</title>
  <desc id="desc">Landscape worksheet to choose three life domains, describe visions, roles and visible proof, reflect on nine character Edges, check coherence, and choose a next action and review point.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 16; ry: 16; }
      .softbox { fill: #f7f7f7; stroke: #111111; stroke-width: 1.5; rx: 12; ry: 12; }
      .fillline { stroke: #999999; stroke-width: 1.1; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 700; fill: #111111; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 700; fill: #111111; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 10px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 8.5px; fill: #111111; }
      .num { font-family: Arial, Helvetica, sans-serif; font-size: 19px; font-weight: 700; fill: #111111; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1100" height="850"/>
  <text class="title" x="40" y="44">VISIONARY DOMAINS</text>
  <text class="subtitle" x="40" y="68">Choose where to look; bring character qualities to the vision.</text>
  <text class="subtitle" x="865" y="52">FIRE FURNACE FORGE</text>

  <rect class="box" x="40" y="84" width="1020" height="75"/>
  <text class="label" x="58" y="106">A focused vision, not a scorecard</text>
  <text class="small" x="58" y="124">Domains are areas of life you choose to focus on; Edges are qualities of character you bring. Pick up to three active</text>
  <text class="small" x="58" y="140">focuses. Others can be in maintenance or deferred—not unimportant. Rename, combine, or replace any example.</text>

  <text class="label" x="40" y="181">Flexible examples</text>
  <text class="tiny" x="155" y="181">Health / capacity • work / contribution • finances • relationships / community • family • meaning / values / growth • recreation / creativity • home / daily life</text>

  <rect class="softbox" x="40" y="196" width="325" height="238"/>
  <text class="num" x="58" y="224">1</text><text class="label" x="88" y="222">FOCUS DOMAIN</text>
  <line class="fillline" x1="58" y1="249" x2="347" y2="249"/>
  <text class="small" x="58" y="272">My longer-term vision here:</text>
  <line class="fillline" x1="58" y1="296" x2="347" y2="296"/><line class="fillline" x1="58" y1="316" x2="347" y2="316"/>
  <text class="small" x="58" y="342">Role I want to embody:</text><line class="fillline" x1="58" y1="360" x2="347" y2="360"/>
  <text class="small" x="58" y="380">Visible proof or next action:</text><line class="fillline" x1="58" y1="397" x2="347" y2="397"/><line class="fillline" x1="58" y1="409" x2="347" y2="409"/>
  <text class="tiny" x="58" y="423">Edges I need / balance:</text><line class="fillline" x1="58" y1="431" x2="347" y2="431"/>

  <rect class="softbox" x="387" y="196" width="325" height="238"/>
  <text class="num" x="405" y="224">2</text><text class="label" x="435" y="222">FOCUS DOMAIN</text>
  <line class="fillline" x1="405" y1="249" x2="694" y2="249"/>
  <text class="small" x="405" y="272">My longer-term vision here:</text>
  <line class="fillline" x1="405" y1="296" x2="694" y2="296"/><line class="fillline" x1="405" y1="316" x2="694" y2="316"/>
  <text class="small" x="405" y="342">Role I want to embody:</text><line class="fillline" x1="405" y1="360" x2="694" y2="360"/>
  <text class="small" x="405" y="380">Visible proof or next action:</text><line class="fillline" x1="405" y1="397" x2="694" y2="397"/><line class="fillline" x1="405" y1="409" x2="694" y2="409"/>
  <text class="tiny" x="405" y="423">Edges I need / balance:</text><line class="fillline" x1="405" y1="431" x2="694" y2="431"/>

  <rect class="softbox" x="734" y="196" width="326" height="238"/>
  <text class="num" x="752" y="224">3</text><text class="label" x="782" y="222">FOCUS DOMAIN</text>
  <line class="fillline" x1="752" y1="249" x2="1042" y2="249"/>
  <text class="small" x="752" y="272">My longer-term vision here:</text>
  <line class="fillline" x1="752" y1="296" x2="1042" y2="296"/><line class="fillline" x1="752" y1="316" x2="1042" y2="316"/>
  <text class="small" x="752" y="342">Role I want to embody:</text><line class="fillline" x1="752" y1="360" x2="1042" y2="360"/>
  <text class="small" x="752" y="380">Visible proof or next action:</text><line class="fillline" x1="752" y1="397" x2="1042" y2="397"/><line class="fillline" x1="752" y1="409" x2="1042" y2="409"/>
  <text class="tiny" x="752" y="423">Edges I need / balance:</text><line class="fillline" x1="752" y1="431" x2="1042" y2="431"/>

  <rect class="box" x="40" y="450" width="1020" height="169"/>
  <text class="label" x="58" y="475">THE NINE EDGES — a reflective lens, not another set of domains</text>
  <text class="tiny" x="58" y="492">For the focus areas, notice which qualities are needed, where balance matters, and where a strength may be overused. Select or reflect freely; no rating required.</text>
  <text class="label" x="60" y="523">Direction</text><text class="tiny" x="60" y="540">What deserves aim?</text>
  <text class="label" x="255" y="523">Craft</text><text class="tiny" x="255" y="540">Where practice?</text>
  <text class="label" x="450" y="523">Alignment</text><text class="tiny" x="450" y="540">What must match?</text>
  <text class="label" x="645" y="523">Stewardship</text><text class="tiny" x="645" y="540">What needs care?</text>
  <text class="label" x="840" y="523">Adaptation</text><text class="tiny" x="840" y="540">What can shift?</text>
  <text class="label" x="60" y="571">Service</text><text class="tiny" x="60" y="588">Who is served?</text>
  <text class="label" x="255" y="571">Legacy</text><text class="tiny" x="255" y="588">What are you building?</text>
  <text class="label" x="450" y="571">Integration</text><text class="tiny" x="450" y="588">What belongs together?</text>
  <text class="label" x="645" y="571">Expression</text><text class="tiny" x="645" y="588">What needs voice?</text>
  <text class="small" x="840" y="572">Needed / balanced /</text><text class="small" x="840" y="589">overused / developing:</text>
  <line class="fillline" x1="945" y1="590" x2="1042" y2="590"/>

  <rect class="box" x="40" y="635" width="495" height="105"/>
  <text class="label" x="58" y="660">CROSS-DOMAIN COHERENCE</text>
  <text class="small" x="58" y="682">Which visions reinforce one another?</text><line class="fillline" x1="58" y1="700" x2="516" y2="700"/>
  <text class="small" x="58" y="725">Tension / trade-off (including what must not be neglected):</text>
  <line class="fillline" x1="58" y1="735" x2="516" y2="735"/>
  <rect class="box" x="555" y="635" width="505" height="105"/>
  <text class="label" x="573" y="660">INTEGRATING NEXT ACTION</text>
  <text class="small" x="573" y="682">What action honors more than one vision or manages the tension?</text>
  <line class="fillline" x1="573" y1="704" x2="1042" y2="704"/><line class="fillline" x1="573" y1="727" x2="1042" y2="727"/>

  <rect class="softbox" x="40" y="756" width="1020" height="64"/>
  <text class="label" x="58" y="781">My next action:</text><line class="fillline" x1="150" y1="781" x2="570" y2="781"/>
  <text class="label" x="600" y="781">Review point / cycle:</text><line class="fillline" x1="745" y1="781" x2="1042" y2="781"/>
  <text class="tiny" x="58" y="804">Choose a meaningful next step; the timing and measure are yours.</text>
</svg>
