<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">Optional Weekly Domain Blotter</title>
  <desc id="desc">A printable optional daily tracker for up to three named domain and role strikes from the weekly plan. Mark each day done, partial, or not done, then carry evidence and one friction moment to the weekly review and recalibration before making a fresh next-week plan.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .softbox { fill: #f7f7f7; stroke: #111111; stroke-width: 1.4; rx: 14; ry: 14; }
      .fillline { stroke: #999999; stroke-width: 1.1; }
      .gridline { stroke: #b5b5b5; stroke-width: 1; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 31px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #111111; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 10px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 8.5px; fill: #111111; }
      .day { font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: 700; fill: #111111; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1100" height="850"/>
  <text class="title" x="40" y="45">WEEKLY DOMAIN BLOTTER</text>
  <text class="sub" x="40" y="70">Optional daily evidence for the strikes you chose</text>
  <text class="label" x="790" y="50">WEEK OF:</text>
  <line class="fillline" x1="860" y1="50" x2="1055" y2="50"/>

  <rect class="softbox" x="40" y="88" width="1020" height="60"/>
  <text class="small" x="60" y="111">Copy the up-to-three domain / role strikes from worksheet 07. Each day, mark one status for each strike.</text>
  <text class="small" x="60" y="131">Done = completed; partial = some progress; not done = did not happen. Blank is fine. These marks describe the plan, not your worth.</text>

  <rect class="box" x="40" y="164" width="1020" height="338"/>
  <text class="label" x="60" y="190">PLANNED DOMAIN / ROLE STRIKE</text>
  <text class="tiny" x="60" y="211">Name each strike as planned on 07; leave unused rows blank.</text>
  <text class="day" x="550" y="211" text-anchor="middle">MON</text>
  <text class="day" x="622" y="211" text-anchor="middle">TUE</text>
  <text class="day" x="694" y="211" text-anchor="middle">WED</text>
  <text class="day" x="766" y="211" text-anchor="middle">THU</text>
  <text class="day" x="838" y="211" text-anchor="middle">FRI</text>
  <text class="day" x="910" y="211" text-anchor="middle">SAT</text>
  <text class="day" x="982" y="211" text-anchor="middle">SUN</text>
  <line class="gridline" x1="500" y1="222" x2="500" y2="480"/>
  <line class="gridline" x1="550" y1="222" x2="550" y2="480"/>
  <line class="gridline" x1="622" y1="222" x2="622" y2="480"/>
  <line class="gridline" x1="694" y1="222" x2="694" y2="480"/>
  <line class="gridline" x1="766" y1="222" x2="766" y2="480"/>
  <line class="gridline" x1="838" y1="222" x2="838" y2="480"/>
  <line class="gridline" x1="910" y1="222" x2="910" y2="480"/>
  <line class="gridline" x1="982" y1="222" x2="982" y2="480"/>
  <text class="tiny" x="60" y="242">1 · Domain / role</text>
  <line class="fillline" x1="60" y1="273" x2="475" y2="273"/>
  <text class="tiny" x="60" y="328">2 · Domain / role</text>
  <line class="fillline" x1="60" y1="359" x2="475" y2="359"/>
  <text class="tiny" x="60" y="414">3 · Domain / role</text>
  <line class="fillline" x1="60" y1="445" x2="475" y2="445"/>
  <line class="gridline" x1="55" y1="288" x2="1045" y2="288"/>
  <line class="gridline" x1="55" y1="374" x2="1045" y2="374"/>
  <line class="gridline" x1="55" y1="460" x2="1045" y2="460"/>
  <text class="tiny" x="60" y="486">In each day cell write D (done), P (partial), or N (not done); use words or another clear mark if preferred.</text>

  <rect class="box" x="40" y="518" width="490" height="142"/>
  <text class="label" x="60" y="545">WEEKLY EVIDENCE</text>
  <text class="small" x="60" y="569">What did the marks and week show about these strikes?</text>
  <line class="fillline" x1="60" y1="594" x2="510" y2="594"/>
  <line class="fillline" x1="60" y1="619" x2="510" y2="619"/>
  <text class="tiny" x="60" y="645">Evidence can include what happened, not just completion.</text>

  <rect class="box" x="550" y="518" width="510" height="142"/>
  <text class="label" x="570" y="545">ONE FRICTION MOMENT</text>
  <text class="small" x="570" y="569">Which moment would be useful to revisit? What happened?</text>
  <line class="fillline" x1="570" y1="594" x2="1040" y2="594"/>
  <line class="fillline" x1="570" y1="619" x2="1040" y2="619"/>
  <text class="tiny" x="570" y="645">Choose a moment with curiosity, not blame.</text>

  <rect class="softbox" x="40" y="676" width="1020" height="132"/>
  <text class="label" x="60" y="702">CARRY THE EVIDENCE FORWARD</text>
  <text class="small" x="60" y="727">08 Weekly role + Edge review: bring the daily marks and evidence into the planned-action recap.</text>
  <text class="small" x="60" y="750">09 Recalibration: bring the friction moment; choose one bounded adjustment for the plan.</text>
  <text class="small" x="60" y="773">Then make a fresh copy of 07 for next week's plan. This optional blotter is not a prerequisite.</text>
  <text class="tiny" x="60" y="794">No totals, targets, or category mapping—use what is helpful and leave the rest blank.</text>
</svg>
