<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">Weekly Domain Blotter</title>
  <desc id="desc">A printable optional daily tracker for up to three domain and role strikes from the Weekly Domain Plan. Record a simple status for each day, then carry evidence and one friction moment to the Weekly Role Review and Weekly Domain Recalibration before making a fresh Weekly Domain Plan.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; rx: 18; ry: 18; }
      .softbox { fill: #f7f7f7; stroke: #111111; stroke-width: 1.4; rx: 14; ry: 14; }
      .fillline { stroke: #999999; stroke-width: 1.1; }
      .gridline { stroke: #b5b5b5; stroke-width: 1; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 31px; font-weight: 700; fill: #111111; }
      .sub { font-family: Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #111111; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 700; fill: #111111; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 10px; fill: #111111; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 8.5px; fill: #111111; }
      .day { font-family: Arial, Helvetica, sans-serif; font-size: 10px; font-weight: 700; fill: #111111; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1100" height="850"/>
  <text class="title" x="40" y="45">WEEKLY DOMAIN BLOTTER</text>
  <text class="sub" x="40" y="70">Optional daily evidence for the strikes you chose</text>
  <text class="label" x="790" y="50">WEEK OF:</text>
  <line class="fillline" x1="860" y1="50" x2="1055" y2="50"/>
  <rect class="softbox" x="40" y="88" width="1020" height="48"/>
  <text class="small" x="60" y="108">Copy up to three domain / role strikes from the Weekly Domain Plan. Mark each day D = done, P = partial, or N = not done.</text>
  <text class="small" x="60" y="126">Blank is fine. These are evidence of the plan, not a score of your worth.</text>
  <rect class="box" x="40" y="150" width="1020" height="372"/>
  <text class="label" x="60" y="178">PLANNED DOMAIN / ROLE STRIKE</text>
  <text class="day" x="554" y="178" text-anchor="middle">MON</text>
  <text class="day" x="622" y="178" text-anchor="middle">TUE</text>
  <text class="day" x="690" y="178" text-anchor="middle">WED</text>
  <text class="day" x="758" y="178" text-anchor="middle">THU</text>
  <text class="day" x="826" y="178" text-anchor="middle">FRI</text>
  <text class="day" x="894" y="178" text-anchor="middle">SAT</text>
  <text class="day" x="962" y="178" text-anchor="middle">SUN</text>
  <line class="gridline" x1="520" y1="190" x2="520" y2="466"/>
  <line class="gridline" x1="588" y1="190" x2="588" y2="466"/>
  <line class="gridline" x1="656" y1="190" x2="656" y2="466"/>
  <line class="gridline" x1="724" y1="190" x2="724" y2="466"/>
  <line class="gridline" x1="792" y1="190" x2="792" y2="466"/>
  <line class="gridline" x1="860" y1="190" x2="860" y2="466"/>
  <line class="gridline" x1="928" y1="190" x2="928" y2="466"/>
  <line class="gridline" x1="996" y1="190" x2="996" y2="466"/>
  <line class="gridline" x1="520" y1="190" x2="996" y2="190"/>
   <line class="gridline" x1="55" y1="282" x2="1045" y2="282"/>
  <line class="gridline" x1="55" y1="374" x2="1045" y2="374"/>
  <line class="gridline" x1="55" y1="466" x2="1045" y2="466"/>
  <text class="tiny" x="60" y="211">1</text>
  <line class="fillline" x1="82" y1="250" x2="500" y2="250"/>
  <text class="tiny" x="60" y="303">2</text>
  <line class="fillline" x1="82" y1="342" x2="500" y2="342"/>
  <text class="tiny" x="60" y="395">3</text>
  <line class="fillline" x1="82" y1="434" x2="500" y2="434"/>
  <text class="tiny" x="60" y="496">Leave unused strike rows blank; write one mark in each day cell.</text>
  <rect class="box" x="40" y="538" width="490" height="150"/>
  <text class="label" x="60" y="566">WEEKLY EVIDENCE</text>
  <text class="small" x="60" y="588">What do the marks show about the strikes?</text>
  <line class="fillline" x1="60" y1="621" x2="510" y2="621"/>
  <line class="fillline" x1="60" y1="653" x2="510" y2="653"/>
  <text class="tiny" x="60" y="677">Note what happened, not just completion.</text>
  <rect class="box" x="550" y="538" width="510" height="150"/>
  <text class="label" x="570" y="566">ONE FRICTION MOMENT</text>
  <text class="small" x="570" y="588">What moment is useful to revisit?</text>
  <line class="fillline" x1="570" y1="621" x2="1040" y2="621"/>
  <line class="fillline" x1="570" y1="653" x2="1040" y2="653"/>
  <text class="tiny" x="570" y="677">Approach it with curiosity, not blame.</text>
  <rect class="softbox" x="40" y="704" width="1020" height="104"/>
  <text class="label" x="60" y="732">HANDOFF</text>
  <text class="small" x="190" y="732">Weekly Role Review: bring marks + evidence</text>
  <text class="small" x="190" y="752">→ Weekly Recalibration: bring friction + adjustment</text>
  <text class="small" x="190" y="772">→ fresh Weekly Domain Plan</text>
  <text class="tiny" x="60" y="796">Optional, non-scoring; use what helps and leave the rest blank.</text>
</svg>
