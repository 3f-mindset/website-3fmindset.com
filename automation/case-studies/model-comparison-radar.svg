<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" role="img" aria-labelledby="title description">
  <title id="title">SteadyBurn model quality and cost comparison</title>
  <desc id="description">A radar chart summarizing the scored, priced case studies. The interactive dashboard contains the complete comparison.</desc>
  <style>.bg{fill:#0b1020}.title{fill:#f8fafc;font:700 28px Arial,sans-serif}.sub,.axis-label,.note{fill:#a5b4c7;font:15px Arial,sans-serif}.grid{fill:none;stroke:#41506d;stroke-width:1}.spoke{stroke:#41506d;stroke-width:1}.legend{fill:#e2e8f0;font:16px Arial,sans-serif}</style>
  <rect class="bg" width="1100" height="760" rx="18"/>
  <text class="title" x="48" y="58">SteadyBurn model quality and cost</text>
  <text class="sub" x="48" y="86">0–100 rubric measurements; cost efficiency is relative to the least-expensive scored paid run.</text>
  <polygon class="grid" points="430.0,339.0 469.9,358.2 479.7,401.3 452.1,435.9 407.9,435.9 380.3,401.3 390.1,358.2"/>
  <polygon class="grid" points="430.0,288.0 509.7,326.4 529.4,412.7 474.3,481.9 385.7,481.9 330.6,412.7 350.3,326.4"/>
  <polygon class="grid" points="430.0,237.0 549.6,294.6 579.2,424.0 496.4,527.8 363.6,527.8 280.8,424.0 310.4,294.6"/>
  <polygon class="grid" points="430.0,186.0 589.5,262.8 628.9,435.4 518.5,573.8 341.5,573.8 231.1,435.4 270.5,262.8"/>
  <polygon class="grid" points="430.0,135.0 629.4,231.0 678.6,446.7 540.6,619.7 319.4,619.7 181.4,446.7 230.6,231.0"/>
  <line class="spoke" x1="430" y1="390" x2="430.0" y2="135.0"/>
  <text class="axis-label" x="430.0" y="96.8" text-anchor="middle">Argument</text>
  <line class="spoke" x1="430" y1="390" x2="629.4" y2="231.0"/>
  <text class="axis-label" x="659.3" y="207.2" text-anchor="middle">Grounding</text>
  <line class="spoke" x1="430" y1="390" x2="678.6" y2="446.7"/>
  <text class="axis-label" x="715.9" y="455.3" text-anchor="middle">Action</text>
  <line class="spoke" x1="430" y1="390" x2="540.6" y2="619.7"/>
  <text class="axis-label" x="557.2" y="654.2" text-anchor="middle">Framework</text>
  <line class="spoke" x1="430" y1="390" x2="319.4" y2="619.7"/>
  <text class="axis-label" x="302.8" y="654.2" text-anchor="middle">Readability</text>
  <line class="spoke" x1="430" y1="390" x2="181.4" y2="446.7"/>
  <text class="axis-label" x="144.1" y="455.3" text-anchor="middle">Voice &amp; closing</text>
  <line class="spoke" x1="430" y1="390" x2="230.6" y2="231.0"/>
  <text class="axis-label" x="200.7" y="207.2" text-anchor="middle">Cost efficiency</text>
  <polygon points="430.0,183.4 614.4,242.9 662.9,443.2 531.2,600.2 340.6,575.7 247.8,431.6 230.6,231.0" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-width="2.5"/>
  <circle cx="760" cy="185" r="6" fill="#38bdf8"/>
  <text class="legend" x="776" y="190">Gemma 4 31B — $0.015143</text>
  <text class="note" x="48" y="708">Local runs remain unpriced and are available in the dashboard table, but cannot receive a cost-efficiency axis.</text>
  <text class="note" x="48" y="734">Source: CONTENT_SCORE.json and OPENROUTER_USAGE.jsonl in each case-study directory.</text>
</svg>
