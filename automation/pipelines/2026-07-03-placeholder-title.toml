[context]
title = "Placeholder Title"
slug = "placeholder-title"
date = "2026-07-03"
target_dir = "content/letters/2026-07-03-placeholder-title"

[providers.text]
kind = "openai-compatible"
base_url = "http://localhost:11434"
model = "active"

[providers.image]
kind = "openai-compatible"
base_url = "http://localhost:11434"
model = "IMAGE_MODEL_NAME"

[providers.audio]
kind = "openai-compatible"
base_url = "http://localhost:11434"
model = "AUDIO_MODEL_NAME"

[variables]
voice = "direct, pragmatic, masculine, concrete"
audience = "men who need structure, ownership, and steady action"

[[steps]]
id = "lesson"
format = "markdown"
prompt_file = "automation/prompts/burn/lesson.md"
output = "content/letters/2026-07-03-placeholder-title/LESSON.md"

[[steps.inputs]]
path = "content/letters/2026-07-03-placeholder-title/PRODUCTION_BRIEF.md"
alias = "brief"

[[steps.inputs]]
path = "content/letters/2026-07-03-placeholder-title/index.md"
alias = "draft_index"

[[steps]]
id = "instructions"
format = "markdown"
prompt_file = "automation/prompts/burn/instructions.md"
depends_on = ["lesson"]
output = "content/letters/2026-07-03-placeholder-title/INSTRUCTIONS.md"

[[steps.inputs]]
step = "lesson"
alias = "lesson"

[[steps.inputs]]
path = "content/letters/2026-07-03-placeholder-title/PRODUCTION_BRIEF.md"
alias = "brief"

[[steps]]
