[context]
title = "Stop Letting Old Stories Control Your Future"
slug = "stop-letting-old-stories-control-your-future"
date = "2026-07-03"
target_dir = "content/letters/2026-07-03-stop-letting-old-stories-control-your-future"

[providers.text]
kind = "openai-compatible"
base_url = "http://localhost:11434"
model = "active"
timeout_seconds = 300
retry_attempts = 4
retry_wait_seconds = 75

[providers.image]
kind = "openai-compatible"
base_url = "http://localhost:11434"
model = "unsloth-qwen-image-2512-gguf-qwen-image-2512-q4-k-m"
timeout_seconds = 900
retry_attempts = 4
retry_wait_seconds = 75

[providers.audio]
kind = "openai-compatible"
base_url = "http://localhost:11434"
model = "AUDIO_MODEL_NAME"

[variables]
voice = "direct, pragmatic, masculine, concrete"
audience = "men who need structure, ownership, and steady action"

[[steps]]
id = "lesson"
format = "markdown"
prompt_file = "automation/prompts/burn/lesson.md"
output = "content/letters/2026-07-03-stop-letting-old-stories-control-your-future/LESSON.md"

[[steps.inputs]]
path = "content/letters/2026-07-03-stop-letting-old-stories-control-your-future/PRODUCTION_BRIEF.md"
