[context]
title = "LETTER TITLE GOES HERE"
slug = "letter-title-goes-here"
date = "YYYY-MM-DD"
target_dir = "content/letters/YYYY-MM-DD-slug"

[providers.text]
kind = "openai-compatible"
base_url = "http://localhost:11434"
model = "active"
timeout_seconds = 300
retry_attempts = 4
retry_wait_seconds = 75

[providers.image]
kind = "openai-compatible"
base_url = "http://localhost:11434"
model = "unsloth-qwen-image-2512-gguf-qwen-image-2512-q4-k-m"
timeout_seconds = 900
retry_attempts = 4
retry_wait_seconds = 75

[providers.audio]
kind = "openai-compatible"
base_url = "http://localhost:11434"
model = "AUDIO_MODEL_NAME"

[variables]
voice = "direct, pragmatic, masculine, concrete"
audience = "men who need structure, ownership, and steady action"

[[steps]]
id = "lesson"
format = "markdown"
prompt_file = "automation/prompts/burn/lesson.md"
output = "content/letters/YYYY-MM-DD-slug/LESSON.md"

[[steps.inputs]]
path = "content/letters/YYYY-MM-DD-slug/CONTEXT.md"
alias = "context"

[[steps.inputs]]
path = "content/letters/YYYY-MM-DD-slug/SEED.md"
alias = "seed"

[[steps.inputs]]
path = "content/letters/YYYY-MM-DD-slug/index.md"
alias = "draft_index"

[[steps]]
id = "instructions"
format = "markdown"
prompt_file = "automation/prompts/burn/instructions.md"
depends_on = ["lesson"]
output = "content/letters/YYYY-MM-DD-slug/INSTRUCTIONS.md"

[[steps.inputs]]
step = "lesson"
alias = "lesson"

[[steps.inputs]]
path = "content/letters/YYYY-MM-DD-slug/CONTEXT.md"
alias = "context"

[[steps.inputs]]
path = "content/letters/YYYY-MM-DD-slug/SEED.md"
alias = "seed"

[[steps]]
id = "gpt"
format = "markdown"
prompt_file = "automation/prompts/burn/gpt.md"
depends_on = ["instructions"]
output = "content/letters/YYYY-MM-DD-slug/GPT.md"

[[steps.inputs]]
path = "content/letters/YYYY-MM-DD-slug/CONTEXT.md"
alias = "context"

[[steps.inputs]]
step = "instructions"
alias = "instructions"

[[steps]]
id = "worksheet"
format = "svg"
prompt_file = "automation/prompts/burn/worksheet-svg.md"
depends_on = ["lesson", "instructions"]
output = "content/letters/YYYY-MM-DD-slug/WORKSHEET.svg"

[[steps.inputs]]
path = "content/letters/YYYY-MM-DD-slug/CONTEXT.md"
alias = "context"

[[steps.inputs]]
step = "lesson"
alias = "lesson"

[[steps.inputs]]
step = "instructions"
alias = "instructions"

[[steps]]
id = "worksheet_masked"
format = "svg"
prompt_file = "automation/prompts/burn/worksheet-masked-svg.md"
depends_on = ["worksheet"]
output = "content/letters/YYYY-MM-DD-slug/WORKSHEET_MASKED.svg"

[[steps.inputs]]
step = "worksheet"
alias = "worksheet"

[[steps]]
id = "promo"
format = "markdown"
prompt_file = "automation/prompts/burn/promo-image.md"
depends_on = ["worksheet_masked"]
output = "content/letters/YYYY-MM-DD-slug/PROMO_PROMPT.md"

[[steps.inputs]]
path = "content/letters/YYYY-MM-DD-slug/CONTEXT.md"
alias = "context"

[[steps.inputs]]
step = "worksheet_masked"
alias = "worksheet_masked"

[[steps]]
id = "promo_image"
format = "png"
modality = "image"
prompt_file = "automation/prompts/burn/render-image.md"
depends_on = ["promo"]
output = "content/letters/YYYY-MM-DD-slug/promo.png"

[[steps.inputs]]
step = "promo"
alias = "asset_prompt"

[[steps]]
id = "banner"
format = "markdown"
prompt_file = "automation/prompts/burn/banner-image.md"
depends_on = ["worksheet_masked", "promo"]
output = "content/letters/YYYY-MM-DD-slug/BANNER_PROMPT.md"

[[steps.inputs]]
path = "content/letters/YYYY-MM-DD-slug/CONTEXT.md"
alias = "context"

[[steps.inputs]]
step = "worksheet_masked"
alias = "worksheet_masked"

[[steps.inputs]]
step = "promo"
alias = "promo"

[[steps]]
id = "banner_image"
format = "png"
modality = "image"
prompt_file = "automation/prompts/burn/render-image.md"
depends_on = ["banner"]
output = "content/letters/YYYY-MM-DD-slug/banner.png"

[[steps.inputs]]
step = "banner"
alias = "asset_prompt"

[[steps]]
id = "cover"
format = "markdown"
prompt_file = "automation/prompts/burn/cover-image.md"
depends_on = ["lesson", "banner"]
output = "content/letters/YYYY-MM-DD-slug/COVER_PROMPT.md"

[[steps.inputs]]
path = "content/letters/YYYY-MM-DD-slug/CONTEXT.md"
alias = "context"

[[steps.inputs]]
step = "lesson"
alias = "lesson"

[[steps.inputs]]
step = "banner"
alias = "banner"

[[steps]]
id = "cover_image"
format = "png"
modality = "image"
prompt_file = "automation/prompts/burn/render-image.md"
depends_on = ["cover"]
output = "content/letters/YYYY-MM-DD-slug/cover.png"

[[steps.inputs]]
step = "cover"
alias = "asset_prompt"

[[steps]]
id = "page_copy"
format = "markdown"
prompt_file = "automation/prompts/burn/page-copy.md"
depends_on = ["promo", "banner"]
output = "content/letters/YYYY-MM-DD-slug/PAGE_COPY.md"

[[steps.inputs]]
path = "content/letters/YYYY-MM-DD-slug/CONTEXT.md"
alias = "context"

[[steps.inputs]]
step = "promo"
alias = "promo"

[[steps.inputs]]
step = "banner"
alias = "banner"

[[steps]]
id = "landing_page"
format = "html"
prompt_file = "automation/prompts/burn/landing-page-html.md"
depends_on = ["banner", "page_copy"]
output = "content/letters/YYYY-MM-DD-slug/LANDING_PAGE.html"

[[steps.inputs]]
path = "content/letters/YYYY-MM-DD-slug/CONTEXT.md"
alias = "context"

[[steps.inputs]]
step = "banner"
alias = "banner"

[[steps.inputs]]
step = "page_copy"
alias = "page_copy"

[[steps]]
id = "worksheet_page"
format = "markdown"
prompt_file = "automation/prompts/burn/worksheet-page-prototype.md"
depends_on = ["promo", "page_copy"]
output = "content/letters/YYYY-MM-DD-slug/WORKSHEET_PAGE.md"

[[steps.inputs]]
path = "content/letters/YYYY-MM-DD-slug/CONTEXT.md"
alias = "context"

[[steps.inputs]]
step = "promo"
alias = "promo"

[[steps.inputs]]
step = "page_copy"
alias = "page_copy"

[[steps]]
id = "index"
format = "markdown"
prompt_file = "automation/prompts/burn/index.md"
depends_on = ["lesson"]
output = "content/letters/YYYY-MM-DD-slug/index.md"

[[steps.inputs]]
path = "content/letters/YYYY-MM-DD-slug/index.md"
alias = "draft_index"

[[steps.inputs]]
step = "lesson"
alias = "lesson"

[[steps.inputs]]
path = "content/letters/YYYY-MM-DD-slug/CONTEXT.md"
alias = "context"

[[steps.inputs]]
path = "content/letters/YYYY-MM-DD-slug/SEED.md"
alias = "seed"

[[steps]]
id = "newsletter_email"
format = "markdown"
prompt_file = "automation/prompts/burn/newsletter-email.md"
depends_on = ["index", "lesson", "instructions", "gpt"]
output = "content/letters/YYYY-MM-DD-slug/NEWSLETTER_EMAIL.md"

[[steps.inputs]]
step = "index"
alias = "index"

[[steps.inputs]]
step = "lesson"
alias = "lesson"

[[steps.inputs]]
step = "instructions"
alias = "instructions"

[[steps.inputs]]
step = "gpt"
alias = "gpt"

[[steps.inputs]]
path = "content/letters/YYYY-MM-DD-slug/CONTEXT.md"
alias = "context"

[[steps]]
id = "community_post"
format = "markdown"
prompt_file = "automation/prompts/burn/community-post.md"
depends_on = ["index"]
output = "content/letters/YYYY-MM-DD-slug/COMMUNITY_POST.md"

[[steps.inputs]]
step = "index"
alias = "index"

[[steps.inputs]]
path = "content/letters/YYYY-MM-DD-slug/CONTEXT.md"
alias = "context"
